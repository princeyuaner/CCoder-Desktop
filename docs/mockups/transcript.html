<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>输出区 · 微信式左右分栏</title>
<style>
/* ── 基础 ───────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #191919; }
body {
  color: #e8e8e8;
  font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
}
code { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: none; cursor: default; }

/* 尺寸照抄真实主区：窗口 1360 − 侧栏 280 = 1080 */
.frame {
  position: relative;
  width: 1080px;
  min-height: 980px;
  padding: 24px 44px 44px;
  background: #191919;
  overflow: hidden;
  flex: none;
}
.wrap { position: relative; max-width: 820px; margin: 0 auto; }

/* ── 左右行骨架（微信结构：头像在外侧，气泡挨着头像） ───── */
.row { display: flex; gap: 10px; margin-bottom: 14px; }
.row--ai { flex-direction: row; }
.row--me { flex-direction: row-reverse; }
.stack { display: flex; flex-direction: column; gap: 7px; min-width: 0; max-width: 78%; }
/* 气泡贴着内容（微信那样），工具行和审批卡撑满整列 */
.row--ai .stack { align-items: flex-start; }
.row--me .stack { align-items: flex-end; }
.tool, .perm { align-self: stretch; }

.avatar {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600;
}

.bubble {
  position: relative;
  padding: 9px 13px;
  font-size: 14px; line-height: 1.7;
  border-radius: 10px;
  background: var(--bub-bg, #2a2a2a);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.bubble--prose { white-space: normal; }
.bubble--prose p { margin-bottom: 11px; }
.bubble--prose p:last-child { margin-bottom: 0; }

/* 气泡尾巴。颜色必须走 --bub-bg —— 用 inherit 取到的是**文字色**，
   会在气泡旁边露出一个浅色三角（第一版就是这么错的） */
.bubble::before {
  content: ''; position: absolute; top: 12px;
  border: 6px solid transparent;
}
.row--ai .bubble::before { left: -11px; border-left: 0; border-right-color: var(--bub-bg); }
.row--me .bubble::before { right: -11px; border-right: 0; border-left-color: var(--bub-bg); }

/* ── 工具行 / 思考条 ────────────────────────────────────── */
.tool {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 11px;
  font-size: 12.5px;
  border-radius: 8px;
  max-width: 100%;
}
.tool .name { flex: none; font-weight: 500; }
.tool .cmd {
  flex: 1; min-width: 0;
  font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: 11.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool .meta { flex: none; font-size: 11px; }
.glyph { flex: none; width: 13px; text-align: center; font-size: 11.5px; }
.glyph.is-run { animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px;
}
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

.cursor {
  display: inline-block; width: 7px; height: 15px; margin-left: 2px;
  vertical-align: text-bottom; border-radius: 1px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0 } }

/* ── 审批卡 ─────────────────────────────────────────────── */
.perm { border-radius: 12px; overflow: hidden; }
.perm__head { display: flex; align-items: center; gap: 10px; padding: 9px 13px; }
.perm__badge { flex: none; padding: 2px 8px; font-size: 11.5px; border-radius: 999px; }
.perm__title { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; }
.perm__note { flex: none; font-size: 11.5px; opacity: .7; }
.perm__path { padding: 0 13px 6px; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; opacity: .6; }
.perm__diff {
  margin: 0 13px; padding: 9px 11px; border-radius: 6px;
  font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11.5px; line-height: 1.55;
}
.dline { white-space: pre; }
.perm__acts { display: flex; gap: 8px; padding: 11px 13px; }
.b { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }

/* ── 一轮结束的分隔条 ───────────────────────────────────── */
.sep {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0 16px; font-size: 11px; letter-spacing: .3px;
}
.sep::before, .sep::after { content: ''; flex: 1; height: 1px; }

/* ══ A · 微信经典 ════════════════════════════════════════ */
[data-v="a"] .bubble--ai { --bub-bg: #2a2a2a; color: #e8e8e8; }
[data-v="a"] .bubble--me { --bub-bg: #2f6b45; color: #eaf6ef; }
[data-v="a"] .avatar--ai { background: #333; color: #a8a8a8; }
[data-v="a"] .avatar--me { background: #2f6b45; color: #eaf6ef; }
[data-v="a"] .tool { background: #212121; border: 1px solid #2c2c2c; color: #a8a8a8; }
[data-v="a"] .tool .cmd { color: #6b6b6b; }
[data-v="a"] .glyph { color: #4b9e5f; }
[data-v="a"] .glyph.is-run { color: #c9a227; }
[data-v="a"] .pill { background: #1f1f1f; color: #7a7a7a; }
[data-v="a"] .sep { color: #5a5a5a; }
[data-v="a"] .sep::before, [data-v="a"] .sep::after { background: #242424; }
[data-v="a"] .perm { background: #1d1d1d; border: 1px solid #5a4a22; }
[data-v="a"] .perm__badge { background: #3a3116; color: #c9a227; }
[data-v="a"] .perm__diff { background: #161616; }
[data-v="a"] .b { border: 1px solid #2c2c2c; color: #a8a8a8; }
[data-v="a"] .b--pri { background: #e8e8e8; border-color: #e8e8e8; color: #191919; font-weight: 500; }
[data-v="a"] .b--dgr { color: #e5534b; border-color: #4a2a28; }
[data-v="a"] .cursor { background: #a8a8a8; }

/* ══ B · 渐变霓虹 ════════════════════════════════════════ */
[data-v="b"] .bubble--me {
  --bub-bg: #2dd4bf;
  background: linear-gradient(135deg, #2dd4bf 0%, #6366f1 100%);
  color: #08131c; font-weight: 500;
  box-shadow: 0 6px 26px rgba(99, 102, 241, .38);
}
[data-v="b"] .bubble--ai {
  --bub-bg: #16181f;
  color: #e2e6f0;
  border: 1px solid rgba(99, 102, 241, .28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
[data-v="b"] .avatar--ai {
  background: #1b1e28; color: #818cf8;
  border: 1px solid rgba(99,102,241,.45);
  box-shadow: 0 0 14px rgba(99,102,241,.3);
}
[data-v="b"] .avatar--me {
  background: linear-gradient(135deg, #2dd4bf, #6366f1); color: #08131c;
  box-shadow: 0 0 14px rgba(45,212,191,.35);
}
[data-v="b"] .tool {
  background: #14161c; border: 1px solid rgba(99,102,241,.16); color: #9aa3b8;
}
[data-v="b"] .tool .cmd { color: #5f6880; }
[data-v="b"] .glyph { color: #2dd4bf; }
[data-v="b"] .glyph.is-run { color: #fbbf24; }
[data-v="b"] .pill { background: #14161c; color: #6b7490; border: 1px solid rgba(99,102,241,.16); }
[data-v="b"] .sep { color: #4f5870; }
[data-v="b"] .sep::before, [data-v="b"] .sep::after { background: #1e2230; }
[data-v="b"] .perm { background: #191612; border: 1px solid rgba(251,191,36,.35); box-shadow: 0 0 22px rgba(251,191,36,.10); }
[data-v="b"] .perm__badge { background: rgba(251,191,36,.15); color: #fbbf24; }
[data-v="b"] .perm__diff { background: #100f0c; }
[data-v="b"] .b { border: 1px solid #33384a; color: #9aa3b8; }
[data-v="b"] .b--pri { background: linear-gradient(135deg,#2dd4bf,#6366f1); border-color: transparent; color: #08131c; font-weight: 600; }
[data-v="b"] .b--dgr { color: #f87171; border-color: #4a2a30; }
[data-v="b"] .cursor { background: #2dd4bf; }

/* ══ C · 玻璃拟态 ════════════════════════════════════════ */
[data-v="c"].frame::before {
  content: ''; position: absolute; inset: -20% -10% auto -10%; height: 70%;
  background:
    radial-gradient(38% 55% at 22% 30%, rgba(139,92,246,.30), transparent 70%),
    radial-gradient(34% 50% at 78% 22%, rgba(34,211,238,.24), transparent 70%),
    radial-gradient(30% 45% at 55% 78%, rgba(236,72,153,.16), transparent 70%);
  filter: blur(30px);
  pointer-events: none;
}
[data-v="c"] .bubble--me {
  --bub-bg: rgba(139, 92, 246, .22);
  color: #f0eaff;
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(14px);
  box-shadow: 0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14);
}
[data-v="c"] .bubble--ai {
  --bub-bg: rgba(255,255,255,.055);
  color: #eaeaf0;
  border: 1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(14px);
  box-shadow: 0 8px 30px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.10);
}
[data-v="c"] .avatar--ai { background: rgba(255,255,255,.08); color: #c9c9d8; border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); }
[data-v="c"] .avatar--me { background: rgba(139,92,246,.30); color: #f0eaff; border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(10px); }
[data-v="c"] .tool {
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(10px); color: #b8b8c8;
}
[data-v="c"] .tool .cmd { color: #7a7a90; }
[data-v="c"] .glyph { color: #7dd3fc; }
[data-v="c"] .glyph.is-run { color: #fcd34d; }
[data-v="c"] .pill { background: rgba(255,255,255,.04); color: #8a8aa0; border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(10px); }
[data-v="c"] .sep { color: #6a6a80; }
[data-v="c"] .sep::before, [data-v="c"] .sep::after { background: rgba(255,255,255,.08); }
[data-v="c"] .perm { background: rgba(255,255,255,.05); border: 1px solid rgba(252,211,77,.30); backdrop-filter: blur(16px); box-shadow: 0 10px 34px rgba(0,0,0,.35); }
[data-v="c"] .perm__badge { background: rgba(252,211,77,.16); color: #fcd34d; }
[data-v="c"] .perm__diff { background: rgba(0,0,0,.35); }
[data-v="c"] .b { border: 1px solid rgba(255,255,255,.16); color: #c0c0d0; backdrop-filter: blur(8px); }
[data-v="c"] .b--pri { background: rgba(255,255,255,.92); border-color: transparent; color: #16161e; font-weight: 600; }
[data-v="c"] .b--dgr { color: #fda4af; border-color: rgba(244,63,94,.35); }
[data-v="c"] .cursor { background: #c4b5fd; }

/* ══ D · 赛博终端 ════════════════════════════════════════ */
[data-v="d"] .bubble, [data-v="d"] .tool, [data-v="d"] .pill, [data-v="d"] .sep, [data-v="d"] .perm {
  font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
}
[data-v="d"] .bubble--me {
  --bub-bg: #08201d;
  color: #5eead4;
  border: 1px solid #14b8a6;
  box-shadow: 0 0 18px rgba(20,184,166,.35), inset 0 0 22px rgba(20,184,166,.08);
  font-size: 13px;
}
[data-v="d"] .bubble--ai {
  --bub-bg: #0d1117;
  color: #cbd5e1;
  border: 1px solid #1e293b; border-left: 2px solid #22d3ee;
  font-size: 13px;
}
[data-v="d"] .avatar--ai { background: #0d1117; color: #22d3ee; border: 1px solid #22d3ee; box-shadow: 0 0 14px rgba(34,211,238,.4); font-family: monospace; }
[data-v="d"] .avatar--me { background: #08201d; color: #5eead4; border: 1px solid #14b8a6; box-shadow: 0 0 14px rgba(20,184,166,.4); font-family: monospace; }
[data-v="d"] .tool {
  background: #0d1117; border: 1px solid #1b2430; color: #94a3b8;
  border-left: 2px solid #164e63;
}
[data-v="d"] .tool .cmd { color: #64748b; }
[data-v="d"] .glyph { color: #22d3ee; }
[data-v="d"] .glyph.is-run { color: #facc15; }
[data-v="d"] .pill { background: #0d1117; color: #64748b; border: 1px solid #1b2430; }
[data-v="d"] .sep { color: #334155; }
[data-v="d"] .sep::before, [data-v="d"] .sep::after { background: #1b2430; }
[data-v="d"] .perm { background: #12100a; border: 1px solid #a16207; box-shadow: 0 0 22px rgba(234,179,8,.15); }
[data-v="d"] .perm__badge { background: rgba(234,179,8,.16); color: #facc15; }
[data-v="d"] .perm__diff { background: #0a0906; }
[data-v="d"] .b { border: 1px solid #334155; color: #94a3b8; }
[data-v="d"] .b--pri { background: #22d3ee; border-color: transparent; color: #04141a; font-weight: 700; }
[data-v="d"] .b--dgr { color: #fb7185; border-color: #4c1d24; }
[data-v="d"] .cursor { background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }

/* ── 对比页 ─────────────────────────────────────────────── */
.sheet { display: grid; grid-template-columns: repeat(2, 1080px); background: #0f0f0f; }
.cell { border: 1px solid #000; }
.cap { display: flex; align-items: baseline; gap: 10px; padding: 12px 20px; background: #0f0f0f; border-bottom: 1px solid #222; }
.cap__k { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #e8e8e8; }
.cap__t { font-size: 12.5px; color: #8a8a8a; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const INLINE = (s) => s.replace(/`([^`]+)`/g, '<code style="padding:1.5px 5px;font-size:.88em;background:rgba(255,255,255,.10);border-radius:5px;white-space:nowrap">$1</code>')

const TOOL = (id, glyphCls, glyph, name, cmd, meta) => `
  <div class="tool">
    <span class="glyph ${glyphCls}">${glyph}</span>
    <span class="name">${name}</span>
    <code class="cmd">${cmd}</code>
    <span class="meta">${meta}</span>
  </div>`

/* 同一段内容喂给四个方案，差别只在视觉语言 */
const SCENE = `
  <div class="row row--me">
    <div class="avatar avatar--me">我</div>
    <div class="stack">
      <div class="bubble bubble--me">把 app.py 里的返回值改成读环境变量，然后跑一下测试</div>
    </div>
  </div>

  <div class="row row--ai">
    <div class="avatar avatar--ai">C</div>
    <div class="stack">
      <div class="pill">⋯ 思考 <span class="meta">1.2 秒</span></div>
      ${TOOL('r', 'is-ok', '✓', 'Read', 'app.py', '12ms')}
      ${TOOL('g', 'is-ok', '✓', 'Grep', 'SERVICE_NAME', '8ms')}

      <div class="bubble bubble--ai bubble--prose">
        <p>${INLINE('`app.py` 里返回的是写死的字符串。我把它改成读环境变量，缺省值不变。')}</p>
        <p>改动前请先过目：</p>
      </div>

      <div class="perm">
        <div class="perm__head">
          <span class="perm__badge">等待你的许可</span>
          <span class="perm__title">编辑 app.py</span>
          <span class="perm__note">+2 −1</span>
        </div>
        <div class="perm__path">C:\\proj\\app.py</div>
        <pre class="perm__diff"><span class="dline is-ctx" style="color:#6b7280">@app.route('/')</span>
<span class="dline is-ctx" style="color:#6b7280">def index():</span>
<span class="dline" style="color:#e08b84;background:rgba(229,83,75,.10)">-    return "hello"</span>
<span class="dline" style="color:#8fd39a;background:rgba(75,158,95,.12)">+    name = os.environ.get("SERVICE_NAME", "hello")</span>
<span class="dline" style="color:#8fd39a;background:rgba(75,158,95,.12)">+    return name</span></pre>
        <div class="perm__acts">
          <button class="b b--pri">允许</button>
          <button class="b">本会话总是允许 Edit</button>
          <button class="b b--dgr">拒绝</button>
        </div>
      </div>

      ${TOOL('e', 'is-ok', '✓', 'Edit', 'app.py', '34ms')}
      ${TOOL('b', 'is-ok', '✓', 'Bash', 'pytest -q', '1.4s')}

      <div class="bubble bubble--ai bubble--prose">
        <p>${INLINE('改好了。`index()` 现在从 `SERVICE_NAME` 读名字，测试 3 个全过。')}</p>
      </div>
    </div>
  </div>

  <div class="sep"><span>已完成 · 用时 12 秒 · 3 步 · 1.2k tok</span></div>

  <div class="row row--me">
    <div class="avatar avatar--me">我</div>
    <div class="stack">
      <div class="bubble bubble--me">再补一个测试</div>
    </div>
  </div>

  <div class="row row--ai">
    <div class="avatar avatar--ai">C</div>
    <div class="stack">
      <div class="pill">⋯ 思考 <span class="pulse">思考中…</span></div>
      ${TOOL('c', 'is-run', '◌', 'Bash', 'pytest --collect-only', '运行中')}
      <div class="bubble bubble--ai bubble--prose">
        <p>${INLINE('现有测试都在 `tests/test_app.py` 里，我照着它的写法补一条：')}<span class="cursor"></span></p>
      </div>
    </div>
  </div>
`

const VARIANTS = [
  ['a', 'A · 微信经典', '头像 + 气泡 + 尾巴，绿白配色。最像微信，最克制'],
  ['b', 'B · 渐变霓虹', '我的气泡青紫渐变 + 外发光，助手深色描边。最亮眼'],
  ['c', 'C · 玻璃拟态', '半透明磨砂 + 背景彩色光晕。最轻盈高级'],
  ['d', 'D · 赛博终端', '等宽字 + 荧光青绿 + 发光边。最硬核']
]

const params = new URLSearchParams(location.search)
const want = params.get('v') || 'a'
const frame = (v) => `<div class="frame" data-v="${v}"><div class="wrap">${SCENE}</div></div>`

if (want === 'all') {
  document.getElementById('root').innerHTML = `
    <div class="sheet">
      ${VARIANTS.map(([v, t, d]) => `
        <div class="cell">
          <div class="cap"><span class="cap__k">${v.toUpperCase()}</span><span class="cap__t">${t} —— ${d}</span></div>
          ${frame(v)}
        </div>`).join('')}
    </div>`
} else {
  document.getElementById('root').innerHTML = frame(want)
}
</script>
</body>
</html>
