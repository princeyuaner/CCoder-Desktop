<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>浅色主题候选 · 效果图</title>
<style>
  /* ── 页面外壳（与产品界面无关） ─────────────────────────── */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    width:1420px;padding:30px 34px 42px;
    background:
      radial-gradient(1200px 600px at 16% -10%, #1d1d22, transparent 60%),
      #131315;
    color:#d9d9de;
    font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
    font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .head h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.2px;color:#f1f1f4;}
  .head p{margin:0 0 2px;font-size:12.5px;color:#82828c;}
  .head .legend{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11.5px;color:#8d8d96;}
  .legend b{display:inline-flex;align-items:center;gap:6px;font-weight:500;}
  .legend i{width:8px;height:8px;border-radius:50%;display:block;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;}
  .card{
    background:#19191c;border:1px solid #2a2a30;border-radius:14px;
    padding:12px 13px 13px;
  }
  .card--cur{background:#17171a;border-style:dashed;border-color:#33333a;}
  .card__head{display:flex;align-items:center;gap:9px;padding:1px 1px 7px;}
  .card__no{
    width:24px;height:24px;border-radius:7px;flex:none;
    display:grid;place-items:center;
    font-size:11.5px;font-weight:700;color:#101013;background:#cfcfd6;
  }
  .card--cur .card__no{background:#4a4a53;color:#d6d6dd;}
  .card__name{font-size:14.5px;font-weight:600;color:#ededf1;letter-spacing:.2px;}
  .card__slug{font:10.5px 'JetBrains Mono','Cascadia Mono',Consolas,monospace;color:#6f6f79;}
  .card__tag{
    font-size:10.5px;line-height:16px;padding:0 7px;border-radius:999px;
    color:#8d8d97;border:1px solid #34343b;white-space:nowrap;
  }
  .card__tag--new{color:#e0c36a;border-color:#5a4c25;background:rgba(224,195,106,.08);}
  .card__desc{padding:0 2px 10px;font-size:11.5px;line-height:1.55;color:#7c7c86;}

  /* ── 迷你窗口：变量由 JS 按主题写到 .win 上 ─────────────── */
  .win{
    height:396px;overflow:hidden;
    display:grid;grid-template-rows:30px 1fr;
    background:var(--app);color:var(--text);
    border:1px solid var(--line);border-radius:10px;
    font-size:12px;line-height:1.45;
  }
  .tb{
    display:flex;align-items:center;gap:8px;padding:0 10px;
    background:var(--side);border-bottom:1px solid var(--line-soft);
  }
  .tl{display:flex;gap:5px;}
  .tl i{width:8px;height:8px;border-radius:50%;background:var(--faint);opacity:.5;display:block;}
  .tb__brand{font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--muted);}
  .tb__path{margin-left:auto;font:10px var(--mono);color:var(--faint);}
  .body{display:grid;grid-template-columns:158px 1fr;min-height:0;}

  /* 侧栏 */
  .side{
    display:flex;flex-direction:column;gap:2px;min-height:0;
    padding:8px 7px;background:var(--side);
    border-right:1px solid var(--line-soft);
  }
  .side__new{
    display:flex;align-items:center;justify-content:center;gap:5px;
    height:26px;margin-bottom:7px;border-radius:6px;
    border:1px solid var(--line);background:var(--raised);
    font-size:11px;color:var(--dim);
  }
  .side__new b{color:var(--text);font-weight:500;}
  .side__grp{padding:5px 6px 3px;font-size:9.5px;letter-spacing:.5px;color:var(--faint);}
  .ws{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:5px;font-size:11px;color:var(--dim);}
  .ws.on{background:var(--hover);color:var(--text);}
  .ws__ico{width:9px;height:7px;border:1px solid currentColor;border-radius:1.5px;opacity:.7;flex:none;}
  .sess{
    display:flex;align-items:center;gap:6px;padding:4.5px 6px 4.5px 13px;
    border-radius:5px;font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;
  }
  .sess.on{background:var(--active);color:var(--text);}
  .sess__dot{width:4px;height:4px;border-radius:50%;background:var(--run);flex:none;}
  .sess__dot.gray{background:var(--faint);}
  .side__foot{
    display:flex;align-items:center;gap:6px;
    margin-top:auto;padding:8px 6px 2px;border-top:1px solid var(--line-soft);
    font-size:10px;color:var(--faint);
  }
  .gear{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;}
  .side__foot em{margin-left:auto;font-style:normal;color:var(--faint);}

  /* 主区 */
  .main{display:grid;grid-template-rows:34px 1fr auto 22px;min-height:0;background:var(--app);}
  .main__head{
    display:flex;align-items:center;gap:6px;padding:0 13px;
    border-bottom:1px solid var(--line-soft);
  }
  .main__title{font-size:12px;font-weight:600;color:var(--text);}
  .chip{
    display:inline-flex;align-items:center;gap:4px;
    padding:1px 7px;font-size:10px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;white-space:nowrap;
  }
  .chip--br{color:var(--br-text);background:var(--br-bg);border-color:var(--br-border);}
  .chat{padding:11px 14px 2px;min-height:0;overflow:hidden;}
  .me{
    width:fit-content;max-width:82%;margin-left:auto;
    padding:5px 10px;font-size:11.5px;color:var(--text);
    background:var(--raised);border:1px solid var(--line-soft);
    border-radius:8px 8px 3px 8px;
  }
  .ai{margin-top:9px;font-size:11.5px;color:var(--dim);line-height:1.6;}
  .ai .hi{color:var(--text);font-weight:600;}
  .ai code{font-family:var(--mono);font-size:10.5px;color:var(--text);}
  .code{
    margin-top:7px;overflow:hidden;
    background:var(--code);border:1px solid var(--line-soft);border-radius:7px;
    font-family:var(--mono);font-size:10px;line-height:1.55;
  }
  .code__h{
    display:flex;justify-content:space-between;align-items:center;
    padding:3px 8px;font-size:9.5px;color:var(--faint);
    border-bottom:1px solid var(--line-soft);
  }
  .code__b{padding:5px 8px 6px;}
  .code__b div{white-space:pre;}
  .k{color:var(--accent);}
  .s{color:var(--ok);}
  .n{color:var(--warn);}
  .c{color:var(--faint);}
  .tool{
    display:flex;align-items:center;gap:6px;margin-top:7px;
    padding:5px 8px;font-size:10.5px;color:var(--muted);
    background:var(--raised);border:1px solid var(--line-soft);border-radius:7px;
  }
  .tool__ico{
    width:14px;height:14px;border-radius:4px;flex:none;
    display:grid;place-items:center;font-size:9px;
    color:var(--dim);background:var(--hover);
  }
  .tool b{font-weight:500;color:var(--dim);}
  .tick{margin-left:auto;color:var(--ok);}
  .diff{
    margin-top:6px;overflow:hidden;
    border:1px solid var(--line-soft);border-radius:7px;
    font-family:var(--mono);font-size:9.5px;
  }
  .diff__h{
    display:flex;justify-content:space-between;
    padding:2px 8px;color:var(--faint);
    border-bottom:1px solid var(--line-soft);background:var(--raised);
  }
  .diff__l{display:flex;gap:7px;padding:2px 8px;}
  .diff__l.add{background:color-mix(in srgb,var(--ok) 10%,var(--code));color:var(--text-dim);}
  .diff__l.del{background:color-mix(in srgb,var(--danger) 9%,var(--code));color:var(--text-dim);}
  .diff__l i{font-style:normal;color:var(--faint);width:8px;flex:none;}
  .diff__l.add i{color:var(--ok);}
  .diff__l.del i{color:var(--danger);}

  /* 输入区 */
  .composer{padding:0 12px 8px;}
  .composer__box{
    display:flex;align-items:center;gap:7px;
    padding:7px 8px 7px 10px;
    background:var(--raised);border:1px solid var(--line);border-radius:9px;
  }
  .composer__box .chip{color:var(--dim);}
  .composer__ph{flex:1;font-size:10.5px;color:var(--faint);}
  .send{
    width:22px;height:22px;flex:none;border-radius:6px;
    display:grid;place-items:center;
    font-size:11px;font-weight:700;
    color:var(--accent-fg);background:var(--accent);
  }
  .status{
    display:flex;align-items:center;gap:9px;padding:0 14px;
    border-top:1px solid var(--line-soft);
    font-size:9.5px;color:var(--faint);
  }
  .status .live{color:var(--run);}
  .status .right{margin-left:auto;}

  /* ── 色板 ─────────────────────────────────────────────── */
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:9px;}
  .sw{min-width:0;}
  .sw i{display:block;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .sw b{display:block;margin-top:4px;font-size:9.5px;font-weight:500;color:#8a8a94;white-space:nowrap;}
  .sw span{display:block;font:9px var(--mono);color:#63636c;white-space:nowrap;}

  .note{
    grid-column:1 / -1;display:flex;gap:14px;align-items:flex-start;
    margin-top:2px;padding:12px 15px;
    background:#17171a;border:1px solid #2a2a30;border-radius:12px;
    font-size:11.5px;line-height:1.7;color:#84848e;
  }
  .note b{color:#c9c9d1;font-weight:600;}
  .note code{font:10.5px var(--mono);color:#a9a9b4;background:#202025;border:1px solid #2e2e35;border-radius:4px;padding:0 5px;}
  .note__col{flex:1;min-width:0;}
</style>
</head>
<body>

<div class="head">
  <h1>浅色主题候选</h1>
  <p>前两张为现有浅色对照，A–F 为新增候选 · 每张卡片是一件迷你界面，重点看底色、正文、强调色、代码块与状态色</p>
  <div class="legend">
    <b><i style="background:#e8c96a"></i>候选</b>
    <b><i style="background:#55555f"></i>现有</b>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>

    }

  {
    no: 'F', name: '纯白', slug: 'paper', tag: '新增',
    desc: '纯白底 + 深蓝强调 + 高对比文字，强光环境和可读性优先时用。',
    vars: {
      app:'#ffffff', side:'#f4f4f5', raised:'#ffffff', hover:'#ededee', active:'#e2e2e4',
      line:'#c9c9cd', soft:'#e3e3e6', text:'#0a0a0b', dim:'#38383d', muted:'#5b5b62', faint:'#86868e',

      code:'#f6f7f9'
    }

];

function winStyle(v){
  return [
    `--app:${v.app}`, `--side:${v.side}`, `--raised:${v.raised}`, `--hover:${v.hover}`, `--active:${v.active}`,
    `--line:${v.line}`, `--line-soft:${v.soft}`,
    `--text:${v.text}`, `--dim:${v.dim}`, `--muted:${v.muted}`, `--faint:${v.faint}`,
    `--accent:${v.acc}`, `--accent-fg:${v.accFg}`,
    `--ok:${v.ok}`, `--warn:${v.warn}`, `--danger:${v.danger}`, `--run:${v.run}`,
    `--br-accent:${v.brAcc}`, `--br-text:${v.brText}`, `--br-bg:${v.brBg}`, `--br-border:${v.brBorder}`,
    `--code:${v.code}`,
    `--mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace`
  ].join(';');
}

function swatch(label, value){
  return `<div class="sw"><i style="background:${value}"></i><b>${label}</b><span>${value}</span></div>`;
}

function windowHTML(v){
  return `
  <div class="win" style="${winStyle(v)}">
    <div class="tb">
      <div class="tl"><i></i><i></i><i></i></div>
      <span class="tb__brand">CCODER</span>
      <span class="tb__path">~/Desktop/CCoder-Desktop</span>
    </div>
    <div class="body">
      <aside class="side">
        <div class="side__new"><b>＋</b> 新会话</div>
        <div class="side__grp">工作区</div>
        <div class="ws on"><span class="ws__ico"></span> CCoder-Desktop</div>
        <div class="sess on"><span class="sess__dot"></span> 浅色主题候选</div>
        <div class="sess"><span class="sess__dot gray"></span> 设置弹窗收尾</div>
        <div class="sess"><span class="sess__dot gray"></span> 会话导出</div>
        <div class="ws"><span class="ws__ico"></span> docs-site</div>
        <div class="sess"><span class="sess__dot gray"></span> README 更新</div>
        <div class="side__foot"><span class="gear"></span> 设置 · 外观<span class="right"></span></div>
      </aside>
      <main class="main">
        <div class="main__head">
          <span class="main__title">浅色主题候选</span>
          <span class="chip">Claude Code</span>
          <span class="chip chip--br">main</span>
          <span class="chip" style="margin-left:auto">1M 上下文</span>
        </div>
        <div class="chat">
          <div class="me">再来几套浅色主题看看</div>
          <div class="ai">
            <span class="hi">先出配色效果图。</span>底色只换 <code>tokens.css</code> 一组变量，组件不用动。
            <div class="code">
              <div class="code__h"><span>tokens.css</span><span>复制</span></div>
              <div class="code__b">
                <div><span class="k">const</span> theme = <span class="s">'${v.app}'</span>;</div>
                <div><span class="k">setTheme</span>(<span class="n">'${v.acc}'</span>);</div>
                <div><span class="c">// 底色 · 文字 · 强调</span></div>
              </div>
            </div>
            <div class="tool">
              <span class="tool__ico">⚙</span>
              <span>Read <b>tokens.css</b></span>
              <span class="tick">✓</span>
            </div>
            <div class="diff">
              <div class="diff__h"><span>theme-light.css</span><span>+2 −1</span></div>
              <div class="diff__l add"><i>+</i><span>html[data-scheme='light'] .tl__me</span></div>
              <div class="diff__l del"><i>−</i><span>background:#fff;</span></div>

          </div>

        </div>
      </main>
    </div>
  </div>`;
}

document.getElementById('grid').innerHTML = THEMES.map((t) => `
  <section class="card ${t.cur ? 'card--cur' : ''}">
    <div class="card__head">
      <span class="card__no">${t.no}</span>
      <span class="card__name">${t.name}</span>
      <span class="card__slug">${t.slug}</span>
      <span class="card__tag ${t.cur ? '' : 'card__tag--new'}">${t.cur ? '现有' : '新增'}</span>
    </div>
    <div class="card__desc">${t.desc}</div>
    ${windowHTML(t.vars)}
    <div class="swatches">
      ${swatch('底色', t.vars.app)}
      ${swatch('浮起', t.vars.raised)}
      ${swatch('正文', t.vars.text)}
      ${swatch('强调', t.vars.acc)}
      ${swatch('运行', t.vars.run)}
      ${swatch('边框', t.vars.line)}
    </div>
  </section>
`).join('') + `
  <div class="note">
    <div class="note__col">
      <b>实现方式</b>
      每套主题 = <code>tokens.css</code> 里一组变量 + <code>THEME_SCHEME</code>/<code>THEME_MODES</code>/<code>THEME_BG</code>/<code>THEME_LABEL_KEY</code> 各加一项，再加中英文名称。
      浅色组件补丁（<code>theme-light.css</code>）默认复用；个别写死的灰色（滚动条、勾选框、删除悬停）会按主题色再调一档。
    </div>
    <div class="note__col">
      <b>评审重点</b>
      ① 底色色偏是否够轻，能不能长时间看；② 强调色与正文的对比度（按钮/链接/选中态）；③ 代码块与 diff 底色是否发灰；
      ④ 是否和现有「浅色 / 暖纸」重复。选定后再落地实现，未选中的不写进代码。
    </div>
  </div>`;
</script>
</body>
</html>
