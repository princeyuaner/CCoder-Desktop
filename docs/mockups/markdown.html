<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>模型输出格式 · 四个方案</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0d0d0f; }
body {
  color: #e8e8ee;
  font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 60px;
}
code, pre { font-family: 'Cascadia Mono', Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: none; cursor: default; }
b { font-weight: 600; }

#bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 24px;
  background: rgba(13,13,15,.92); backdrop-filter: blur(14px);
  border-bottom: 1px solid #1e1e24;
}
#bar h1 { font-size: 14px; font-weight: 600; margin-right: 10px; color: #cfcfd8; }
.tabbtn {
  padding: 6px 14px; font-size: 13px; border-radius: 8px;
  color: #9a9aa8; border: 1px solid #26262e; background: #16161a;
}
.tabbtn:hover { color: #d8d8e2; border-color: #35353f; }
.tabbtn.is-on { color: #0d0d0f; background: #e8e8ee; border-color: #e8e8ee; font-weight: 600; }
#desc { padding: 12px 24px 0; font-size: 12.5px; color: #7c7c8c; max-width: 960px; line-height: 1.75; }
#desc b { color: #b9b9c8; font-weight: 500; }
#stage { padding: 18px 24px 0; }

/* ── 场景：沿用 A 时间轴 ─────────────────────────────── */
.pane {
  width: 1080px;
  background: #191919;
  border: 1px solid #26262e; border-radius: 12px;
  padding: 24px 44px 28px;
}
.inner { max-width: 820px; margin: 0 auto; }
.tl { position: relative; }
.tl::before {
  content: ''; position: absolute; left: 4px; top: 10px; bottom: 14px;
  width: 1px; background: #2c2c2c;
}
.row { position: relative; padding-left: 26px; margin-bottom: 14px; }
.dot {
  position: absolute; left: 0; top: 5px; width: 9px; height: 9px;
  border-radius: 50%; background: #3a3a46; box-shadow: 0 0 0 3px #191919;
}
.dot.me { background: #22d3ee; box-shadow: 0 0 0 3px #191919, 0 0 10px rgba(34,211,238,.55); }
.me {
  display: inline-block; margin-left: auto; padding: 7px 12px;
  font-size: 14px; line-height: 1.65; color: #d8f8ff;
  background: rgba(34,211,238,.09); border: 1px solid rgba(34,211,238,.22);
  border-radius: 8px;
}
.row--me { display: flex; justify-content: flex-end; }

/* 共用语法高亮色 */
.k { color: #c792ea; }
.f { color: #82aaff; }
.s { color: #c3e88d; }
.b { color: #ffcb6b; }
.d { color: #7fdbca; }
.c1 { color: #5a5a68; }

/* ══ A · 标准 Markdown ══════════════════════════════════ */
[data-v="a"] .md h3 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: #f0f0f6; }
[data-v="a"] .md p { font-size: 14px; line-height: 1.8; margin: 0 0 14px; color: #dcdce6; }
[data-v="a"] .md ul { margin: 0 0 14px; padding-left: 22px; }
[data-v="a"] .md li { font-size: 14px; line-height: 1.75; margin-bottom: 6px; color: #dcdce6; }
[data-v="a"] .md strong { color: #fff; }
[data-v="a"] .ic {
  padding: 2px 6px; font-size: .88em; border-radius: 5px;
  background: #26262f; color: #ddd6fe;
}
[data-v="a"] .codebox {
  margin: 0 0 16px; background: #141419;
  border: 1px solid #26262e; border-radius: 8px; overflow: hidden;
}
[data-v="a"] .codebar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-bottom: 1px solid #23232b;
  font-size: 11.5px; color: #6a6a78;
}
[data-v="a"] .codebar .sp { flex: 1; }
[data-v="a"] .codebar .cp { color: #6a6a78; }
[data-v="a"] pre {
  padding: 11px 13px; font-size: 12.5px; line-height: 1.65;
  color: #c8c8d4; overflow-x: auto; white-space: pre;
}
[data-v="a"] table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 13.5px; }
[data-v="a"] th {
  text-align: left; padding: 7px 12px; font-weight: 500; color: #8a8a9c;
  border-bottom: 1px solid #2c2c34;
}
[data-v="a"] td { padding: 7px 12px; color: #d0d0dc; border-bottom: 1px solid #23232b; }
[data-v="a"] .ok { color: #6ee7a8; }

/* ══ B · 代码优先 ═══════════════════════════════════════ */
/* 正文收窄，但代码块要**撑满**整列 —— 这才是"代码优先"的意思 */
[data-v="b"] .md > h3,
[data-v="b"] .md > p,
[data-v="b"] .md > ul,
[data-v="b"] .md > table { max-width: 640px; }
[data-v="b"] .md h3 {
  font-size: 13px; font-weight: 600; letter-spacing: .3px;
  margin: 0 0 10px; color: #9a9aac;
}
[data-v="b"] .md p { font-size: 13.5px; line-height: 1.8; margin: 0 0 12px; color: #c0c0cc; }
[data-v="b"] .md ul { margin: 0 0 12px; padding-left: 18px; }
[data-v="b"] .md li { font-size: 13.5px; line-height: 1.7; margin-bottom: 4px; color: #c0c0cc; }
[data-v="b"] .md strong { color: #efe9ff; }
[data-v="b"] .ic { padding: 1px 5px; font-size: .88em; color: #b8a8e8; }
[data-v="b"] .codebox {
  margin: 0 0 18px; background: #0f0f14;
  border: 1px solid #2a2a36; border-radius: 10px; overflow: hidden;
  box-shadow: 0 6px 22px rgba(0,0,0,.35);
}
[data-v="b"] .codebar {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 13px; background: #16161d; border-bottom: 1px solid #26262f;
  font-size: 11.5px; color: #8a8a9c;
}
[data-v="b"] .codebar .fn { font-family: 'Cascadia Mono', Consolas, monospace; color: #b0b0c0; }
[data-v="b"] .codebar .sp { flex: 1; }
[data-v="b"] .codebar .cp { color: #6a6a78; }
[data-v="b"] .gut { display: flex; }
[data-v="b"] .ln {
  flex: none; padding: 12px 10px 12px 13px; text-align: right;
  font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12.5px; line-height: 1.7;
  color: #3f3f4c; background: #121219; border-right: 1px solid #22222c;
  user-select: none;
}
[data-v="b"] pre {
  flex: 1; padding: 12px 14px; font-size: 12.5px; line-height: 1.7;
  color: #c8c8d4; overflow-x: auto; white-space: pre;
}
[data-v="b"] table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13px; }
[data-v="b"] th { text-align: left; padding: 5px 10px; font-weight: 500; color: #7a7a8c; }
[data-v="b"] td { padding: 5px 10px; color: #c0c0cc; }
[data-v="b"] tbody tr + tr td { border-top: 1px solid #23232b; }
[data-v="b"] .ok { color: #6ee7a8; }

/* ══ C · 紧凑文档 ═══════════════════════════════════════ */
[data-v="c"] .md h3 {
  font-size: 14px; font-weight: 600; margin: 18px 0 8px; color: #e8e8f0;
}
[data-v="c"] .md h3:first-child { margin-top: 0; }
[data-v="c"] .md p { font-size: 13.5px; line-height: 1.85; margin: 0 0 12px; color: #d4d4de; }
[data-v="c"] .md ul { margin: 0 0 12px; padding-left: 18px; }
[data-v="c"] .md li { font-size: 13.5px; line-height: 1.75; margin-bottom: 3px; color: #d4d4de; }
[data-v="c"] .md strong { color: #fff; }
[data-v="c"] .ic { padding: 0 3px; font-size: .9em; color: #ddd6fe; background: rgba(255,255,255,.06); border-radius: 3px; }
[data-v="c"] .codebox {
  margin: 0 0 14px; padding: 10px 14px;
  background: rgba(255,255,255,.028);
  border-left: 3px solid #3a3a46; border-radius: 0 6px 6px 0;
}
[data-v="c"] .lang {
  display: block; margin-bottom: 7px;
  font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; color: #5a5a68;
}
[data-v="c"] pre {
  font-size: 12.5px; line-height: 1.7; color: #c4c4d0;
  overflow-x: auto; white-space: pre;
}
[data-v="c"] table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13px; }
[data-v="c"] th {
  text-align: left; padding: 5px 0; font-weight: 500; color: #7a7a8c;
  border-bottom: 1px solid #2c2c34;
}
[data-v="c"] td { padding: 5px 0; color: #d0d0dc; border-bottom: 1px solid #202028; }
[data-v="c"] .ok { color: #6ee7a8; }

/* ══ D · 分块卡片 ═══════════════════════════════════════ */
[data-v="d"] .md { display: flex; flex-direction: column; gap: 9px; }
[data-v="d"] .blk {
  position: relative;
  padding: 12px 15px;
  background: #1c1c22; border: 1px solid #26262f; border-radius: 10px;
}
[data-v="d"] .blk__tag {
  position: absolute; top: 8px; right: 11px;
  font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; color: #44444f;
}
[data-v="d"] .md h3 { font-size: 15px; font-weight: 600; margin: 0; color: #f0f0f6; }
[data-v="d"] .md p { font-size: 14px; line-height: 1.8; margin: 0; color: #dcdce6; }
[data-v="d"] .md ul { margin: 0; padding-left: 20px; }
[data-v="d"] .md li { font-size: 14px; line-height: 1.75; margin-bottom: 5px; color: #dcdce6; }
[data-v="d"] .md li:last-child { margin-bottom: 0; }
[data-v="d"] .md strong { color: #fff; }
[data-v="d"] .ic { padding: 2px 6px; font-size: .88em; border-radius: 5px; background: #2a2a34; color: #ddd6fe; }
[data-v="d"] .codebox { padding: 0; overflow: hidden; background: #131318; }
[data-v="d"] .codebar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 13px; background: #191920; border-bottom: 1px solid #26262f;
  font-size: 11.5px; color: #7a7a8c;
}
[data-v="d"] .codebar .sp { flex: 1; }
[data-v="d"] .codebar .cp { color: #6a6a78; }
[data-v="d"] pre { padding: 11px 13px; font-size: 12.5px; line-height: 1.65; color: #c8c8d4; overflow-x: auto; white-space: pre; }
[data-v="d"] table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
[data-v="d"] th { text-align: left; padding: 6px 10px; font-weight: 500; color: #8a8a9c; border-bottom: 1px solid #2c2c34; }
[data-v="d"] td { padding: 6px 10px; color: #d0d0dc; border-bottom: 1px solid #23232b; }
[data-v="d"] tr:last-child td { border-bottom: none; }
[data-v="d"] .ok { color: #6ee7a8; }
</style>
</head>
<body>

<div id="bar">
  <h1>模型输出格式 · 四个方案</h1>
  <button class="tabbtn" data-k="a">A 标准 Markdown</button>
  <button class="tabbtn" data-k="b">B 代码优先</button>
  <button class="tabbtn" data-k="c">C 紧凑文档</button>
  <button class="tabbtn" data-k="d">D 分块卡片</button>
</div>
<div id="desc"></div>
<div id="stage"></div>

<script>
const CODE = [
  '<span class="k">import</span> os',
  '<span class="k">from</span> flask <span class="k">import</span> Flask',
  '',
  'app = Flask(__name__)',
  '',
  '<span class="k">def</span> <span class="f">service_name</span>() -&gt; <span class="b">str</span>:',
  '    <span class="k">return</span> os.environ.get(<span class="s">"SERVICE_NAME"</span>, <span class="s">"hello"</span>)',
  '',
  '<span class="d">@app.route</span>(<span class="s">"/"</span>)',
  '<span class="k">def</span> <span class="f">index</span>():',
  '    <span class="k">return</span> <span class="f">service_name</span>()'
]
const codeHTML = () => CODE.join('\n')
const numbered = () =>
  CODE.map((l, i) => l).join('\n')

const ROWS = [
  ['test_index_default', '✓ 通过'],
  ['test_index_custom', '✓ 通过']
]

const TABLE = (cls) => `<table>
  <thead><tr><th>用例</th><th>结果</th></tr></thead>
  <tbody>${ROWS.map(([a, b]) => `<tr><td>${a}</td><td class="${cls}">${b}</td></tr>`).join('')}</tbody>
</table>`

const PROSE = `<p><code class="ic">app.py</code> 里返回的是写死的字符串。我把它改成读环境变量，缺省值不变：</p>`

const LIST = `<ul>
  <li>新增 <code class="ic">SERVICE_NAME</code> 环境变量</li>
  <li>没设的时候回落到 <code class="ic">"hello"</code>，行为跟现在一样</li>
  <li>顺带把 <code class="ic">index()</code> 拆成两个小函数</li>
</ul>`

const TAIL = `<p>跑了下测试，两个都过。</p><p><strong>注意：</strong>部署时要记得设 <code class="ic">SERVICE_NAME</code>，否则线上还是 hello。</p>`

/* ── 场景外壳 ─────────────────────────────────────────── */
const CTX = (v, body) => `
  <div class="pane" data-v="${v}"><div class="inner"><div class="tl">
    <div class="row row--me">
      <span class="dot me"></span>
      <span class="me">把 app.py 里的返回值改成读环境变量，然后跑一下测试</span>
    </div>
    <div class="row">
      <span class="dot"></span>
      <div class="md">${body}</div>
    </div>
  </div></div></div>`

/* ══ A · 标准 Markdown ══════════════════════════════════ */
const A = CTX('a', `
  <h3>改动说明</h3>
  ${PROSE}
  ${LIST}
  <div class="codebox">
    <div class="codebar"><span>python</span><span class="sp"></span><span class="cp">复制</span></div>
    <pre>${codeHTML()}</pre>
  </div>
  <p>跑了下测试，两个都过：</p>
  ${TABLE('ok')}
  <p><strong>注意：</strong>部署时要记得设 <code class="ic">SERVICE_NAME</code>，否则线上还是 hello。</p>
`)

/* ══ B · 代码优先 ═══════════════════════════════════════ */
const B = CTX('b', `
  <h3>改动说明</h3>
  ${PROSE}
  ${LIST}
  <div class="codebox">
    <div class="codebar">
      <span class="fn">app.py</span><span>·</span><span>python</span>
      <span class="sp"></span><span class="cp">复制</span>
    </div>
    <div class="gut">
      <div class="ln">${CODE.map((_, i) => i + 1).join('<br>')}</div>
      <pre>${codeHTML()}</pre>
    </div>
  </div>
  <p>跑了下测试，两个都过：</p>
  ${TABLE('ok')}
  <p><strong>注意：</strong>部署时要记得设 <code class="ic">SERVICE_NAME</code>，否则线上还是 hello。</p>
`)

/* ══ C · 紧凑文档 ═══════════════════════════════════════ */
const C = CTX('c', `
  <h3>改动说明</h3>
  ${PROSE}
  ${LIST}
  <div class="codebox">
    <span class="lang">python</span>
    <pre>${codeHTML()}</pre>
  </div>
  <p>跑了下测试，两个都过：</p>
  ${TABLE('ok')}
  <p><strong>注意：</strong>部署时要记得设 <code class="ic">SERVICE_NAME</code>，否则线上还是 hello。</p>
`)

/* ══ D · 分块卡片 ═══════════════════════════════════════ */
const D = CTX('d', `
  <div class="blk"><span class="blk__tag">标题</span><h3>改动说明</h3></div>
  <div class="blk"><span class="blk__tag">段落</span><p><code class="ic">app.py</code> 里返回的是写死的字符串。我把它改成读环境变量，缺省值不变：</p></div>
  <div class="blk"><span class="blk__tag">列表</span><ul>
    <li>新增 <code class="ic">SERVICE_NAME</code> 环境变量</li>
    <li>没设的时候回落到 <code class="ic">"hello"</code>，行为跟现在一样</li>
    <li>顺带把 <code class="ic">index()</code> 拆成两个小函数</li>
  </ul></div>
  <div class="blk codebox">
    <div class="codebar"><span>python</span><span class="sp"></span><span class="cp">复制</span></div>
    <pre>${codeHTML()}</pre>
  </div>
  <div class="blk"><span class="blk__tag">表格</span>${TABLE('ok')}</div>
  <div class="blk"><span class="blk__tag">段落</span><p><strong>注意：</strong>部署时要记得设 <code class="ic">SERVICE_NAME</code>，否则线上还是 hello。</p></div>
`)

const VARIANTS = {
  a: { html: A, desc: '<b>A 标准 Markdown</b> —— 按 GitHub 的规矩来：标题、粗体、列表、代码块带语言标签和复制、表格带表头。最不会出错，谁看都懂。代码块是深色小方框，不抢正文。' },
  b: { html: B, desc: '<b>B 代码优先</b> —— 正文收窄（640px）往后退，代码块全宽、带文件名 + 语言 + 行号 + 复制，阴影托起来。看代码最舒服。代价是表格和正文被压得比较小，纯文字回答会显得空。' },
  c: { html: C, desc: '<b>C 紧凑文档</b> —— 代码不做成方框，只用左边一条竖线 + 略深的底，标题更小更安静，整体字号收一档。最耐读、最少"UI 感"，像一份排版好的文档。代价是代码块边界弱，长代码容易和正文糊在一起。' },
  d: { html: D, desc: '<b>D 分块卡片</b> —— 每个块（标题 / 段落 / 列表 / 代码 / 表格）各自一张卡，右上角标类型。结构最清楚、最好扫。代价是卡片多、留白多，同样内容占的屏幕是 A 的两倍多，长回答要滚很久。' }
}

const params = new URLSearchParams(location.search)
const raw = params.get('v')
const only = raw && raw !== 'bar' ? raw : null
const bar = document.getElementById('bar')
const desc = document.getElementById('desc')
const stage = document.getElementById('stage')

function show(k) {
  desc.innerHTML = VARIANTS[k].desc
  stage.innerHTML = VARIANTS[k].html
  for (const b of bar.querySelectorAll('.tabbtn')) b.classList.toggle('is-on', b.dataset.k === k)
}

if (only) {
  bar.remove(); desc.remove()
  stage.style.padding = '0'
  stage.innerHTML = VARIANTS[only].html
} else {
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('.tabbtn')
    if (b) show(b.dataset.k)
  })
  show('a')
}
</script>
</body>
</html>
