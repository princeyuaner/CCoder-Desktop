<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>CCoder 主题候选</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #08090a;
    color: #d8d8d8;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 34px 36px 40px;
    width: 1320px;
  }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .2px; color: #f2f2f2; }
  .head p { margin: 0; font-size: 13px; color: #7e7e86; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 20px; }

  .card { border-radius: 14px; background: #111113; border: 1px solid #232327; padding: 12px; }
  .card__head { display: flex; align-items: center; gap: 10px; padding: 2px 2px 11px; }
  .card__no {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    color: #0b0b0c; background: #d7d7dc;
  }
  .card__name { font-size: 14.5px; font-weight: 600; color: #ededf0; letter-spacing: .2px; }
  .card__tag { font-size: 11px; color: #8a8a92; border: 1px solid #303036; border-radius: 999px; padding: 2px 8px; }
  .dots { display: flex; gap: 5px; margin-left: auto; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; border: 1px solid rgba(127,127,127,.28); }
  .card__desc { font-size: 11.5px; color: #77777f; padding: 0 2px 10px; }

  /* ── 迷你窗口 ─────────────────────────────────────────── */
  .win {
    border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    background: var(--app); color: var(--text); height: 322px;
    display: grid; grid-template-rows: 30px 1fr;
    font-size: 12px; line-height: 1.45;
  }
  .tb {
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--side); border-bottom: 1px solid var(--line-soft);
  }
  .tl { display: flex; gap: 5px; }
  .tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); opacity: .55; display: block; }
  .tb__brand { font-size: 10.5px; letter-spacing: .6px; color: var(--muted); }
  .tb__path { margin-left: auto; font-size: 10px; color: var(--faint); font-family: var(--mono); }
  .body { display: grid; grid-template-columns: 148px 1fr; min-height: 0; }

  .side { background: var(--side); border-right: 1px solid var(--line-soft); padding: 8px 7px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .side__new {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    height: 25px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--dim); font-size: 11px; margin-bottom: 7px;
  }
  .side__new b { color: var(--text); font-weight: 500; }
  .side__grp { font-size: 9.5px; color: var(--faint); letter-spacing: .5px; padding: 5px 6px 3px; }
  .ws { display: flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 5px; color: var(--dim); font-size: 11px; }
  .ws.on { background: var(--hover); color: var(--text); }
  .ws__ico { width: 9px; height: 7px; border: 1px solid currentColor; border-radius: 1.5px; opacity: .7; flex: none; }
  .sess { display: flex; align-items: center; gap: 6px; padding: 4.5px 6px 4.5px 13px; border-radius: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .sess.on { background: var(--active); color: var(--text); }
  .sess__dot { width: 4px; height: 4px; border-radius: 50%; background: var(--run); flex: none; }
  .sess__dot.gray { background: var(--faint); }
  .side__foot { margin-top: auto; padding: 6px; font-size: 10px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .side__foot .gear { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }

  .main { display: grid; grid-template-rows: 1fr auto; min-height: 0; background: var(--app); }
  .chat { padding: 12px 16px 8px; min-height: 0; }
  .me {
    margin-left: auto; width: fit-content; max-width: 246px;
    background: var(--raised); border: 1px solid var(--line-soft);
    border-radius: 8px; padding: 6px 10px; font-size: 11.5px; color: var(--text);
  }
  .ai { margin-top: 9px; font-size: 11.5px; color: var(--dim); }
  .ai .hi { color: var(--text); }
  .code { margin-top: 7px; background: var(--code); border: 1px solid var(--line-soft); border-radius: 7px; overflow: hidden; }
  .code__h { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 9.5px; color: var(--faint); border-bottom: 1px solid var(--line-soft); font-family: var(--mono); }
  .code__b { padding: 7px 8px 8px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .code__b .k { color: var(--run); }
  .code__b .s { color: var(--ok); }
  .tool {
    margin-top: 7px; display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-soft); background: var(--raised);
    border-radius: 7px; padding: 5px 8px; font-size: 10.5px; color: var(--muted);
  }
  .tool__ico { width: 14px; height: 14px; border-radius: 4px; background: var(--hover); color: var(--dim); display: grid; place-items: center; font-size: 9px; }
  .tool b { color: var(--dim); font-weight: 500; }
  .tool .tick { margin-left: auto; color: var(--ok); }

  .composer { padding: 0 14px 12px; }
  .composer__box {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--raised);
    border-radius: 9px; padding: 8px 9px 8px 11px;
  }
  .composer__ph { color: var(--faint); font-size: 11px; flex: 1; }
  .chip {
    font-size: 9.5px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 7px; white-space: nowrap;
  }
  .send { width: 22px; height: 22px; border-radius: 6px; background: var(--acc); color: var(--acc-fg); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .status { display: flex; gap: 10px; padding-top: 6px; font-size: 9.5px; color: var(--faint); }
  .status .live { color: var(--run); }

  /* 主题变量 */
  .t-dark {
    --app:#191919; --side:#141414; --raised:#232323; --hover:#1f1f1f; --active:#2a2a2a;
    --line:#2c2c2c; --line-soft:#242424; --text:#e8e8e8; --dim:#a8a8a8; --muted:#8a8a8a; --faint:#6b6b6b;
    --acc:#e8e8e8; --acc-fg:#191919; --ok:#4b9e5f; --warn:#c9a227; --danger:#e5534b; --run:#d97757; --code:#1f1f1f;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-light {
    --app:#f6f6f7; --side:#efeff1; --raised:#ffffff; --hover:#e9e9ec; --active:#e2e2e6;
    --line:#d7d7dc; --line-soft:#e5e5e8; --text:#1d1d1f; --dim:#4c4c53; --muted:#6c6c75; --faint:#95959e;
    --acc:#1d1d1f; --acc-fg:#ffffff; --ok:#2f8a45; --warn:#a97b0b; --danger:#c83b32; --run:#b04a28; --code:#f0f0f3;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-midnight {
    --app:#0c141f; --side:#091019; --raised:#142032; --hover:#101b29; --active:#192639;
    --line:#243447; --line-soft:#182536; --text:#dbe7f6; --dim:#9fb3cb; --muted:#7e94ad; --faint:#5f7691;
    --acc:#5b9dff; --acc-fg:#08111c; --ok:#4fb57a; --warn:#d9a93a; --danger:#e5645c; --run:#e2896b; --code:#101c2c;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-forest {
    --app:#0f1612; --side:#0b110e; --raised:#17211a; --hover:#131c16; --active:#1d2a21;
    --line:#2a3a2e; --line-soft:#1e2c23; --text:#e2ede5; --dim:#a2b8a8; --muted:#82988a; --faint:#62786a;
    --acc:#7fc99a; --acc-fg:#0c1410; --ok:#55b877; --warn:#cfa83a; --danger:#e06058; --run:#e09a63; --code:#131e17;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-mist {
    --app:#232833; --side:#20252f; --raised:#2e3440; --hover:#2a303b; --active:#353d4b;
    --line:#3e4757; --line-soft:#343b47; --text:#eceff4; --dim:#c0c9d7; --muted:#9aa6b8; --faint:#77849a;
    --acc:#b8a1e0; --acc-fg:#1c2130; --ok:#a3be8c; --warn:#ebcb8b; --danger:#d06b73; --run:#d08770; --code:#2b313c;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-sepia {
    --app:#f3eee3; --side:#ebe5d8; --raised:#fffbf2; --hover:#e7e0d2; --active:#ded5c4;
    --line:#d7cbb6; --line-soft:#e4dbc9; --text:#322a1e; --dim:#5c5040; --muted:#7b6c57; --faint:#9a8b74;
    --acc:#6b4f2b; --acc-fg:#fffbf2; --ok:#3f7d46; --warn:#a06b0b; --danger:#b8442f; --run:#b05f36; --code:#ece4d5;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-coffee {
    --app:#1b1713; --side:#15110e; --raised:#26201a; --hover:#211b16; --active:#2e271f;
    --line:#3a3229; --line-soft:#2a231d; --text:#ece4d9; --dim:#bcae9e; --muted:#9c8e7d; --faint:#7b6f60;
    --acc:#d7a77a; --acc-fg:#1b1713; --ok:#7fb98c; --warn:#d3a948; --danger:#e06a5e; --run:#e0966a; --code:#221c17;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-contrast {
    --app:#000000; --side:#000000; --raised:#121212; --hover:#1c1c1c; --active:#262626;
    --line:#555555; --line-soft:#3a3a3a; --text:#ffffff; --dim:#dedede; --muted:#c0c0c0; --faint:#a0a0a0;
    --acc:#ffd60a; --acc-fg:#000000; --ok:#4dff88; --warn:#ffd60a; --danger:#ff665c; --run:#ff9b6a; --code:#0d0d0d;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  .t-moss { /* 苔原：冷灰绿，低饱和 */
    --app:#171a19; --side:#131615; --raised:#202523; --hover:#1b201e; --active:#252b28;
    --line:#333b37; --line-soft:#262d2a; --text:#e4e9e6; --dim:#aab4ae; --muted:#8b968f; --faint:#6b756f;
    --acc:#9fc4ae; --acc-fg:#121615; --ok:#71b58a; --warn:#c7a95c; --danger:#d97b72; --run:#d69a6f; --code:#1c211f;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="head">
    <h1>主题方案</h1>
    <p>A–B 为现有主题，C–I 为新增候选 · 每张卡片是一件迷你界面，重点看底色、正文、强调色和代码块</p>
  </div>

  <div class="grid" id="grid"></div>

<script>
const THEMES = [
  { no: 'A', cls: 't-dark',     name: '深色',    tag: '现有', desc: '中性炭黑 + 珊瑚色运行态，当前默认。' },
  { no: 'B', cls: 't-light',    name: '浅色',    tag: '现有', desc: '干净的白灰界面，适合白天使用。' },
  { no: 'C', cls: 't-midnight', name: '午夜蓝',  tag: '深色', desc: '深海军蓝底 + 亮蓝强调，冷峻、屏幕感强。' },
  { no: 'D', cls: 't-forest',   name: '森林绿',  tag: '深色', desc: '墨绿底 + 薄荷绿强调，安静耐看。' },
  { no: 'E', cls: 't-mist',     name: '雾紫',    tag: '深色', desc: 'Nord 式蓝灰底 + 雾紫强调，柔和低对比。' },
  { no: 'F', cls: 't-coffee',   name: '咖啡棕',  tag: '深色', desc: '暖褐底 + 拿铁色强调，夜里不刺眼。' },
  { no: 'G', cls: 't-sepia',    name: '暖纸',    tag: '浅色', desc: '米黄纸面 + 深褐文字，长时间阅读舒服。' },
  { no: 'H', cls: 't-moss',     name: '苔原',    tag: '深色', desc: '冷灰绿、几乎无彩色，刻意压低的界面。' },
  { no: 'I', cls: 't-contrast', name: '高对比',  tag: '深色', desc: '纯黑底 + 黄强调，为可读性优先的场景。' }
]

const swatches = ['--app', '--raised', '--text', '--acc', '--run']

document.getElementById('grid').innerHTML = THEMES.map((t) => `
  <section class="card">
    <div class="card__head">
      <span class="card__no">${t.no}</span>
      <span class="card__name">${t.name}</span>
      <span class="card__tag">${t.tag}</span>
      <div class="dots">${swatches.map((v) => `<i style="background:var(${v})"></i>`).join('')}</div>
    </div>
    <div class="card__desc">${t.desc}</div>
    <div class="win ${t.cls}">
      <div class="tb">
        <div class="tl"><i></i><i></i><i></i></div>
        <div class="tb__brand">CCODER</div>
        <div class="tb__path">~/Desktop/CCoder-Desktop</div>
      </div>
      <div class="body">
        <aside class="side">
          <div class="side__new"><b>＋</b> 新会话</div>
          <div class="side__grp">工作区</div>
          <div class="ws on"><span class="ws__ico"></span> CCoder-Desktop</div>
          <div class="sess on"><span class="sess__dot"></span> 设置里增加几个主题</div>
          <div class="sess"><span class="sess__dot gray"></span> 修复会话列表滚动</div>
          <div class="sess"><span class="sess__dot gray"></span> 优化工具卡展开</div>
          <div class="ws"><span class="ws__ico"></span> docs-site</div>
          <div class="sess"><span class="sess__dot gray"></span> README 更新</div>
          <div class="side__foot"><span class="gear"></span> 设置 · 主题</div>
        </aside>
        <div class="main">
          <div class="chat">
            <div class="me">设置里增加几个主题</div>
            <div class="ai">
              <div class="hi">好的，先给几套配色看看效果：</div>
              <div class="code">
                <div class="code__h"><span>tokens.css</span><span>复制</span></div>
                <div class="code__b"><span class="k">const</span> theme = <span class="s">'${t.cls.replace('t-', '')}'</span></div>
                <div class="code__b"><span class="k">setTheme</span>(theme)</div>
              </div>
              <div class="tool"><span class="tool__ico">⚙</span> Read&nbsp;<b>tokens.css</b><span class="tick">✓</span></div>
            </div>
          </div>
          <div class="composer">
            <div class="composer__box">
              <span class="chip">⌘ 标准</span>
              <span class="composer__ph">继续输入…</span>
              <span class="send">↑</span>
            </div>
            <div class="status"><span>Claude Code</span><span>deepseek-v4.1</span><span class="live">● 运行中</span><span style="margin-left:auto">12.4k 上下文</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>
`).join('')
</script>
</body>
</html>
