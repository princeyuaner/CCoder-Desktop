<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>工具调用 · 参考 B 的四个变体</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0d0d0f; }
body {
  color: #e8e8e8;
  font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 40px;
}
code, pre { font-family: 'Cascadia Mono', Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: none; cursor: default; }
b { font-weight: 600; }
::-webkit-scrollbar { width: 0; height: 0; }

#bar {
  position: sticky; top: 0; z-index: 90;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 24px;
  background: rgba(13,13,15,.92); backdrop-filter: blur(14px);
  border-bottom: 1px solid #1e1e24;
}
#bar h1 { font-size: 14px; font-weight: 600; margin-right: 10px; color: #cfcfd8; }
.tabbtn {
  padding: 6px 14px; font-size: 13px; border-radius: 8px;
  color: #9a9aa8; border: 1px solid #26262e; background: #16161a;
}
.tabbtn:hover { color: #d8d8e2; border-color: #35353f; }
.tabbtn.is-on { color: #0d0d0f; background: #e8e8ee; border-color: #e8e8ee; font-weight: 600; }
#desc { padding: 12px 24px 0; font-size: 12.5px; color: #7c7c8c; max-width: 1080px; line-height: 1.8; }
#desc b { color: #b9b9c8; font-weight: 500; }
#desc code { color: #b8a8e8; }
#desc .fact {
  display: block; margin-top: 8px; padding: 9px 12px;
  background: rgba(255,255,255,.03); border-left: 2px solid #3a3a46; border-radius: 0 6px 6px 0;
  color: #8a8a9c;
}
#stage { padding: 18px 24px 0; }

/* ══ 舞台 ═══════════════════════════════════════════════ */
.pane {
  width: 940px;
  padding: 26px 0 26px;
  background: #191919;
  border: 1px solid #26262e;
  border-radius: 12px;
}
.tl { position: relative; width: 780px; margin: 0 auto; }
.tl::before {
  content: ''; position: absolute; left: 4px; top: 10px; bottom: 12px;
  width: 1px; background: #2c2c2e;
}
.row { position: relative; padding-left: 26px; margin-bottom: 9px; }
.dot {
  position: absolute; left: 0; top: 9px; width: 9px; height: 9px; border-radius: 50%;
  box-shadow: 0 0 0 3px #191919;
}
.dot.ok { background: #4b9e5f; }
.dot.run { background: #c9a227; }
.dot.err { background: #e5534b; }
.dot.think { background: #3a3a46; }
.note { position: relative; padding-left: 26px; margin: 16px 0 12px; font-size: 12px; color: #4f4f5c; }
.note .dot { top: 5px; }

/* 共用：工具字形、统计、正文 */
.g { font-style: normal; }
.ico { flex: none; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,.055); }
.ico.t-bash { color: #9ece6a; }
.ico.t-read { color: #7aa2f7; }
.ico.t-edit { color: #e0af68; }
.ico.t-write { color: #c4a7f7; }
.ico.is-run { color: #c9a227; animation: spin 1.6s linear infinite; }
.ico.is-err { color: #e5534b; }

.stat { display: inline-flex; align-items: center; gap: 3px; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 10.5px; font-variant-numeric: tabular-nums; }
.stat .add { color: #7fbf7f; }
.stat .del { color: #d98a8a; }
.pillstat { display: inline-flex; gap: 4px; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 10px; font-variant-numeric: tabular-nums; }
.pillstat span { padding: 0 4px; border-radius: 3px; line-height: 1.5; }
.pillstat .add { color: #8fcf8f; background: rgba(75, 158, 95, .13); }
.pillstat .del { color: #e39b9b; background: rgba(229, 83, 75, .11); }

.body .cmd { font-size: 11.5px; line-height: 1.65; color: #a8a8bc; white-space: pre-wrap; overflow-wrap: anywhere; }
.body .cmd::before { content: '$ '; color: #4d4d5c; }
.body .out {
  margin-top: 7px; padding-top: 7px; border-top: 1px dashed rgba(255,255,255,.06);
  font-size: 11px; line-height: 1.6; color: #6f6f80; white-space: pre-wrap;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ══ 1 精修：B 的骨架，统计内联 ══════════════════════════ */
.v1 {
  background: #1c1c22; border: 1px solid #28282f; border-radius: 8px; overflow: hidden;
}
.v1.is-run { border-color: rgba(201, 162, 39, .30); }
.v1.is-err { border-color: rgba(229, 83, 75, .32); }
.v1-main { display: flex; align-items: center; gap: 9px; padding: 7px 10px; }
.v1 .ico { width: 20px; height: 20px; font-size: 11px; }
.v1-sub { flex: 1; min-width: 0; font-size: 12.5px; color: #d2d2dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v1-dir { flex: none; font-size: 10.5px; color: #4f4f5c; }
.v1-name { flex: none; font-size: 10px; letter-spacing: .06em; color: #5c5c6e; }
.v1-time { flex: none; font-size: 10.5px; color: #55555f; }
.v1-chev { flex: none; font-size: 9px; color: #4a4a55; }
.v1-body { padding: 8px 11px 9px 40px; border-top: 1px solid #26262d; background: rgba(0, 0, 0, .16); }

/* ══ 2 色条：状态在左缘，统计成小药丸 ════════════════════ */
.v2 {
  position: relative;
  background: #1b1b21; border: 1px solid #27272e; border-radius: 7px; overflow: hidden;
}
.v2::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #4b9e5f; }
.v2.is-run::before { background: #c9a227; }
.v2.is-err::before { background: #e5534b; }
.v2-main { display: flex; align-items: center; gap: 9px; padding: 7px 10px 7px 11px; }
.v2 .g { width: 14px; text-align: center; font-size: 11.5px; }
.v2 .g.t-bash { color: #9ece6a; }
.v2 .g.t-read { color: #7aa2f7; }
.v2 .g.t-edit { color: #e0af68; }
.v2 .g.t-write { color: #c4a7f7; }
.v2 .g.is-run { color: #c9a227; animation: spin 1.6s linear infinite; }
.v2 .g.is-err { color: #e5534b; }
.v2-sub { flex: 1; min-width: 0; font-size: 12.5px; color: #d2d2dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v2-dir { flex: none; font-size: 10.5px; color: #4f4f5c; }
.v2-name { flex: none; font-size: 10px; letter-spacing: .06em; color: #5c5c6e; }
.v2-time { flex: none; font-size: 10.5px; color: #55555f; }
.v2-chev { flex: none; font-size: 9px; color: #4a4a55; }
.v2-body { padding: 8px 11px 9px 33px; border-top: 1px solid #25252c; background: rgba(0, 0, 0, .16); }

/* ══ 3 双层：主题一行，工具元信息一行 ════════════════════ */
.v3 {
  background: #1c1c22; border: 1px solid #28282f; border-radius: 8px; overflow: hidden;
}
.v3.is-run { border-color: rgba(201, 162, 39, .30); }
.v3.is-err { border-color: rgba(229, 83, 75, .32); }
.v3-main { display: flex; align-items: center; gap: 9px; padding: 7px 10px 2px; }
.v3 .ico { width: 20px; height: 20px; font-size: 11px; }
.v3-sub { flex: 1; min-width: 0; font-size: 12.5px; color: #d2d2dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v3-chev { flex: none; font-size: 9px; color: #4a4a55; }
.v3-meta { display: flex; align-items: center; gap: 6px; padding: 0 10px 7px 39px; font-size: 10.5px; color: #55555f; }
.v3-meta .mn { color: #5c5c6e; }
.v3-meta .sep { color: #3a3a44; }
.v3-meta .path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4f4f5c; }
.v3-body { padding: 8px 11px 9px 39px; border-top: 1px solid #26262d; background: rgba(0, 0, 0, .16); }

/* ══ 4 统计成列：数字右对齐，像一张账 ════════════════════ */
.v4 {
  background: #1c1c22; border: 1px solid #28282f; border-radius: 7px; overflow: hidden;
}
.v4.is-run { border-color: rgba(201, 162, 39, .30); }
.v4.is-err { border-color: rgba(229, 83, 75, .32); }
.v4-main { display: flex; align-items: center; gap: 9px; padding: 6px 10px; }
.v4 .ico { width: 18px; height: 18px; font-size: 10px; }
.v4-sub { flex: 1; min-width: 0; font-size: 12.5px; color: #d2d2dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v4-stat { flex: none; width: 62px; text-align: right; }
.v4-name { flex: none; width: 34px; text-align: right; font-size: 9.5px; letter-spacing: .06em; color: #5c5c6e; }
.v4-time { flex: none; width: 34px; text-align: right; font-size: 10px; color: #55555f; }
.v4-chev { flex: none; font-size: 9px; color: #4a4a55; width: 8px; }
.v4-body { padding: 8px 11px 9px 38px; border-top: 1px solid #26262d; background: rgba(0, 0, 0, .16); }
</style>
</head>

y=689 runs=283..1060</div>

const params = new URLSearchParams(location.search)
const raw = params.get('v')
const only = raw && raw !== 'bar' ? raw : null
const bar = document.getElementById('bar')
const desc = document.getElementById('desc')
const stage = document.getElementById('stage')

function show(k) {
  desc.innerHTML = VARIANTS[k].desc
  stage.innerHTML = VARIANTS[k].html
  for (const b of bar.querySelectorAll('.tabbtn')) b.classList.toggle('is-on', b.dataset.k === k)
}

if (only) {
  bar.remove(); desc.remove()
  stage.style.padding = '0'
  stage.innerHTML = VARIANTS[only].html
} else {
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('.tabbtn')
    if (b) show(b.dataset.k)
  })
  show('1')
}
</script>
