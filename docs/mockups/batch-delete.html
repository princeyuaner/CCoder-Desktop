<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>会话列表 · 批量勾选删除</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0d0d0f; }
body {
  color: #e8e8e8;
  font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 56px;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: default; }
code { font-family: 'Cascadia Mono', Consolas, monospace; }
b { font-weight: 600; }

/* ── 说明栏 ─────────────────────────────────────────────── */
#bar {
  position: sticky; top: 0; z-index: 90;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 24px;
  background: rgba(13,13,15,.92); backdrop-filter: blur(14px);
  border-bottom: 1px solid #1e1e24;
}
#bar h1 { font-size: 14px; font-weight: 600; margin-right: 10px; color: #cfcfd8; }
.tabbtn {
  padding: 6px 14px; font-size: 13px; border-radius: 8px;
  color: #9a9aa8; border: 1px solid #26262e; background: #16161a;
}
.tabbtn:hover { color: #d8d8e2; border-color: #35353f; }
.tabbtn.is-on { color: #0d0d0f; background: #e8e8ee; border-color: #e8e8ee; font-weight: 600; }
#desc { padding: 12px 24px 0; font-size: 12.5px; color: #7c7c8c; max-width: 1120px; line-height: 1.85; }
#desc b { color: #b9b9c8; font-weight: 500; }
#desc .fact {
  display: block; margin-top: 8px; padding: 9px 12px;
  background: rgba(255,255,255,.03); border-left: 2px solid #3a3a46; border-radius: 0 6px 6px 0;
  color: #8a8a9c;
}
#desc .rec {
  display: inline-block; margin-left: 8px; padding: 1px 7px; vertical-align: 1px;
  font-size: 10.5px; color: #a5f3fc; background: rgba(34,211,238,.12);
  border: 1px solid rgba(34,211,238,.28); border-radius: 999px;
}
#stage { padding: 18px 24px 0; }

/* ── 应用外壳（照 shell.css / tokens.css 取值）─────────── */
:root {
  --bg-app: #191919;
  --bg-sidebar: #141414;
  --bg-raised: #232323;
  --bg-hover: #1f1f1f;
  --bg-active: #2a2a2a;
  --border: #2c2c2c;
  --border-soft: #242424;
  --text: #e8e8e8;
  --text-dim: #a8a8a8;
  --text-muted: #8a8a8a;
  --text-faint: #6b6b6b;
  --accent: #e8e8e8;
  --accent-fg: #191919;
  --ok: #4b9e5f;
  --warn: #c9a227;
  --danger: #e5534b;
  --running: #d97757;
  --font-mono: 'Cascadia Mono', Consolas, monospace;
}
.frame {
  width: 1120px; height: 700px;
  display: flex; flex-direction: column;
  background: var(--bg-app);
  border: 1px solid #26262e; border-radius: 12px; overflow: hidden;
  position: relative;
}
.titlebar {
  flex: none; height: 36px; display: flex; align-items: center;
  background: var(--bg-app); border-bottom: 1px solid var(--border-soft);
}
.brand { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.brand__name { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
.wctl { display: grid; place-items: center; width: 46px; height: 100%; color: var(--text-dim); }
.wctl:last-child { color: var(--text-dim); }
.wcts { display: flex; align-items: center; height: 100%; margin-left: auto; }
.body { flex: 1; display: flex; min-height: 0; }

/* 侧栏 */
.sidebar {
  flex: none; width: 280px; display: flex; flex-direction: column;
  background: var(--bg-sidebar); border-right: 1px solid var(--border-soft);
  padding: 10px 10px 6px; min-height: 0;
}
.sidebar__nav { display: flex; flex-direction: column; gap: 1px; padding-bottom: 8px; }
.navitem {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px;
  font-size: 13.5px; color: var(--text-dim); border-radius: 6px; text-align: left;
}
.navitem:hover { background: var(--bg-hover); color: var(--text); }
.navitem svg { flex: none; color: var(--text-muted); }
.sidebar__section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px 6px;
}
.sidebar__section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: .4px; }
.sidebar__newws { display: grid; place-items: center; width: 22px; height: 22px; margin-left: 4px; border-radius: 6px; color: var(--text-muted); }
.sidebar__newws:hover { background: var(--bg-raised); color: var(--text); }
.sidebar__section-tools { display: flex; gap: 2px; margin-left: auto; }
.iconbtn {
  display: grid; place-items: center; width: 26px; height: 26px;
  color: var(--text-muted); border-radius: 6px;
}
.iconbtn:hover { background: var(--bg-raised); color: var(--text); }
.iconbtn.is-new { position: relative; }
.iconbtn.is-new::after {
  content: ''; position: absolute; inset: 2px; border-radius: 6px;
  border: 1px dashed rgba(34,211,238,.55);
  animation: hint 2.4s ease-in-out infinite;
}
@keyframes hint { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

.sidebar__scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.wsgroup { padding-bottom: 8px; }
.wsgroup + .wsgroup { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
.wsgroup__head { display: flex; align-items: center; gap: 5px; padding: 6px 8px; color: var(--text-dim); }
.wsgroup__iconbtn { display: grid; place-items: center; width: 22px; height: 22px; margin: 0 -2px 0 -4px; border-radius: 5px; }
.wsgroup__icon { color: var(--text-muted); }
.wsgroup__name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wsgroup__count { flex: none; font-size: 11.5px; color: var(--text-faint); }
.wsgroup__acts { display: flex; gap: 2px; flex: none; }
.wsact { display: grid; place-items: center; width: 20px; height: 20px; font-size: 14px; line-height: 1; color: var(--text-faint); border-radius: 5px; }
.wsact:hover { background: var(--bg-active); color: var(--text); }

/* 会话行 */
.session { display: flex; align-items: flex-start; border-radius: 6px; position: relative; }
.session:hover { background: var(--bg-hover); }
.session.is-active { background: var(--bg-active); }
.session.is-checked { background: rgba(232,232,232,.055); }
.session.is-checked:hover { background: rgba(232,232,232,.085); }
.session__main {
  display: flex; align-items: flex-start; gap: 9px; flex: 1; min-width: 0;
  padding: 5px 4px 5px 12px; text-align: left;
}
.session__cli { flex: none; margin-top: 1px; }
.session__text { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.session__line1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
.session__title { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session.is-active .session__title { color: var(--text); }
.session.is-checked .session__title { color: var(--text); }
.session__time { flex: none; font-size: 12px; color: var(--text-faint); }
.session__time--running { color: var(--running); }
.session__more, .session__del {
  flex: none; display: grid; place-items: center; width: 20px; height: 20px;
  margin: 5px 5px 0 0; color: var(--text-faint); border-radius: 5px; opacity: 0;
}
.session:hover .session__more, .session:hover .session__del { opacity: 1; }
.session__del:hover { background: rgba(244,63,94,.14); color: #fda4af; }
.session__more:hover { background: var(--bg-active); color: var(--text); }
/* 方案 B：勾选框占住「×」的位置，未选中时随 hover 出现 */
.session__pick {
  flex: none; display: grid; place-items: center;
  width: 20px; height: 20px; margin: 5px 5px 0 0; border-radius: 5px;
}
.session:hover .session__pick { background: var(--bg-active); }
.session__pick .cbx { margin: 0; opacity: 0; transition: opacity .1s; }
.session:hover .session__pick .cbx,
.session.is-hover .session__pick .cbx,
.session.is-checked .session__pick .cbx { opacity: 1; }
.session__pick:hover .cbx { border-color: #8a8a94; }
.session.is-hover { background: var(--bg-hover); }
.session.is-hover .session__del { opacity: 1; }
.session.is-hover .session__pick { background: var(--bg-active); }

/* 勾选框 */
.cbx {
  flex: none; display: grid; place-items: center;
  width: 14px; height: 14px; margin-top: 4px;
  border: 1.5px solid #4a4a52; border-radius: 4px;
  background: transparent; color: transparent;
  transition: background .1s, border-color .1s;
}
.cbx svg { opacity: 0; }
.cbx:hover { border-color: #6d6d78; }
.cbx.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.cbx.is-on svg { opacity: 1; }
.cbx.is-part { background: var(--accent); border-color: var(--accent); }
.cbx.is-part::after { content: ''; width: 7px; height: 1.5px; border-radius: 1px; background: var(--accent-fg); }
.selection .session__main { padding-left: 8px; padding-right: 9px; }

/* 组头的全选：复选框在目录图标左边，文件夹仍然点得开 IDE */
.wsgroup__head .cbx { margin: 0 -1px 0 0; }

/* 底部批量操作条 */
.batchbar {
  margin: 4px 0 4px; padding: 8px 8px 8px 11px;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  animation: rise .16s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px) } }
.batchbar__count { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-dim); }
.batchbar__count b { color: var(--text); font-weight: 600; }
.batchbar__count span { color: var(--text-faint); }
.batchbar__btn {
  flex: none; height: 26px; padding: 0 9px; font-size: 12.5px;
  color: var(--text-dim); border: 1px solid rgba(255,255,255,.14); border-radius: 7px;
}
.batchbar__btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
.batchbar__btn--danger { color: #fda4af; border-color: rgba(244,63,94,.35); }
.batchbar__btn--danger:hover { background: rgba(244,63,94,.13); color: #fecdd3; }
.batchbar__btn--danger:disabled { opacity: .4; border-color: rgba(244,63,94,.2); background: none; }

/* 顶部（方案 C）选择工具条 */
.selectbar {
  display: flex; align-items: center; gap: 6px;
  margin: 8px 0 4px; padding: 5px 6px 5px 11px;
  background: rgba(232,232,232,.06); border: 1px solid rgba(232,232,232,.12);
  border-radius: 8px;
}
.selectbar__count { flex: 1; font-size: 12.5px; color: var(--text-dim); }
.selectbar__count b { color: var(--text); }
.selectbar__btn { flex: none; height: 24px; padding: 0 8px; font-size: 12px; color: var(--text-dim); border-radius: 6px; }
.selectbar__btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
.selectbar__btn--danger { color: #fda4af; }
.selectbar__btn--danger:hover { background: rgba(244,63,94,.14); }

.sidebar__archived {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px;
  font-size: 13px; color: var(--text-faint); border-radius: 6px; text-align: left;
}
.sidebar__settings {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-top: 4px;
  font-size: 13.5px; color: var(--text-dim); border-radius: 6px; text-align: left;
}
.sidebar__settings:hover { background: var(--bg-hover); color: var(--text); }
.sidebar__settings svg, .sidebar__archived svg { color: var(--text-muted); }

/* 主区（只作背景，用来看遮挡 / 视觉重心） */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-app); }
.chat-head { flex: none; padding: 12px 28px 0; border-bottom: 1px solid var(--border-soft); }
.chat-title { font-size: 14px; font-weight: 600; color: var(--text); }
.chat-sub { margin-top: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
.chat-tabs { display: flex; gap: 18px; margin-top: 12px; }
.chat-tabs span { padding-bottom: 8px; font-size: 13px; color: var(--text-faint); border-bottom: 2px solid transparent; }
.chat-tabs span.is-on { color: var(--text); border-bottom-color: var(--text); }
.chat-body { flex: 1; min-height: 0; padding: 18px 28px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.msg-user {
  align-self: flex-end; max-width: 620px; padding: 10px 14px;
  font-size: 13.5px; line-height: 1.7; color: #dce8e2;
  background: #1b2422; border: 1px solid #26332f; border-radius: 12px;
}
.para { font-size: 13.5px; line-height: 1.8; color: var(--text-dim); max-width: 680px; }
.toolrow {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px; font-size: 12.5px; color: var(--text-muted);
  border: 1px solid var(--border-soft); border-radius: 8px;
}
.toolrow__tag { margin-left: auto; font-size: 10px; color: var(--text-faint); letter-spacing: .5px; }
.composer {
  flex: none; margin: 0 28px 18px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 12px;
  font-size: 12.5px; color: var(--text-faint);
}
.composer__row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.chip { padding: 3px 8px; font-size: 11px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 999px; }
.chip--send { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; background: rgba(255,255,255,.1); color: var(--text-dim); border-radius: 999px; }

/* 确认弹窗（照 chat.css .modal*） */
.modal { position: absolute; inset: 36px 0 0; z-index: 60; }
.modal__scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.modal__dlg {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; width: 560px; max-height: calc(100% - 64px);
  background: var(--bg-raised); border: 1px solid rgba(244,63,94,.42); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 0 3px rgba(244,63,94,.09);
  overflow: hidden;
}
.modal__h { display: flex; align-items: center; gap: 10px; padding: 13px 16px 12px; border-bottom: 1px solid #2c2c34; }
.modal__badge { flex: none; padding: 2px 9px; font-size: 11.5px; border-radius: 999px; color: #fda4af; background: rgba(244,63,94,.16); }
.modal__t { flex: 1; font-size: 14px; font-weight: 500; }
.modal__b { flex: 1; min-height: 0; overflow: auto; padding: 13px 16px 0; }
.modal__f { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid #2c2c34; }
.modal__sp { flex: 1; }
.btn { height: 30px; padding: 0 13px; font-size: 12.5px; border-radius: 7px; border: 1px solid rgba(255,255,255,.16); color: #c0c0d0; }
.btn:hover { background: rgba(255,255,255,.08); color: #e8e8f0; }
.btn--danger { color: #fda4af; border-color: rgba(244,63,94,.35); }
.btn--danger:hover { background: rgba(244,63,94,.12); }
.kbd { margin-left: 6px; font-size: 10.5px; opacity: .62; }
.modal__group { margin-bottom: 12px; }
.modal__group-name { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-faint); margin-bottom: 6px; }
.modal__group-name code { color: var(--text-muted); font-size: 11px; }
.modal__item { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 7px; background: rgba(255,255,255,.028); margin-bottom: 3px; }
.modal__item-cli { flex: none; }
.modal__item-title { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal__item-state { flex: none; font-size: 10.5px; color: #fda4af; }
.modal__summary { margin: 4px 0 12px; font-size: 12.5px; line-height: 1.75; color: var(--text-muted); }
.modal__summary b { color: var(--text); }
.modal__warn {
  display: flex; align-items: flex-start; gap: 8px; margin-bottom: 13px;
  padding: 9px 11px; font-size: 12px; line-height: 1.6;
  color: #e8b0b8; background: rgba(244,63,94,.08); border-radius: 8px;
}
.modal__warn b { color: #fda4af; }
</style>
</head>
<body>
<div id="bar">
  <h1>会话列表 · 批量勾选删除</h1>
  <button class="tabbtn" data-k="a">A 选择模式 + 底部操作条</button>
  <button class="tabbtn" data-k="b">B 直接勾选 + 范围选择</button>
  <button class="tabbtn" data-k="c">C 顶部工具条</button>
  <button class="tabbtn" data-k="d">D 批量删除确认</button>
</div>
<div id="desc"></div>
<div id="stage"></div>

<script>

const cbx = (state, cls = '') => {
  // state: '' | 'is-on' | 'is-part'
  if (state === 'is-part') return `<span class="cbx is-part ${cls}"></span>`
  return `<span class="cbx ${state} ${cls}">${ICON.check}</span>`
}

const rowIcon = (cli) => `<span class="session__cli">${ICON[cli]}</span>`

function sessionRow(s, opt = {}) {
  const { selection = false, hoverRow = false } = opt
  const on = CHECKED.has(keyOf(s))
  return `
  <div class="session ${s.active ? 'is-active' : ''} ${on ? 'is-checked' : ''} ${hoverRow ? 'is-hover' : ''}">
    ${selection
      ? `<div class="session__main">
           ${cbx(on ? 'is-on' : '', 'cbx--row')}
           ${rowIcon(s.cli)}
           <span class="session__text">
             <span class="session__line1">
               <span class="session__title">${s.title}</span>
               <span class="session__time ${s.running ? 'session__time--running' : ''}">${s.time}</span>
             </span>
           </span>
         </div>`
      : `<button class="session__main">
           ${rowIcon(s.cli)}
           <span class="session__text">
             <span class="session__line1">
               <span class="session__title">${s.title}</span>
               <span class="session__time ${s.running ? 'session__time--running' : ''}">${s.time}</span>
             </span>
           </span>
         </button>
         <button class="session__pick" title="${on ? '取消选择' : '选择'}">${cbx(on ? 'is-on' : '')}</button>
         ${hoverRow && !on ? '<button class="session__del" title="删除会话">×</button>' : ''}`}
  </div>`
}

function groupHead(ws, opt = {}) {
  const { selection = false } = opt
  const checked = ws.sessions.filter((s) => CHECKED.has(keyOf(s))).length
  const state = checked === 0 ? '' : checked === ws.sessions.length ? 'is-on' : 'is-part'
  return `
  <div class="wsgroup__head" title="${ws.cwd}">
    ${selection ? cbx(state) : ''}
    <button class="wsgroup__iconbtn">${ICON.folder}</button>
    <span class="wsgroup__name">${ws.name}</span>
    <span class="wsgroup__count">${ws.sessions.length}</span>
    <span class="wsgroup__acts">
      <button class="wsact" title="在这个目录新建会话">${ICON.plus}</button>
      <button class="wsact" title="关闭工作区">×</button>
    </span>
  </div>`
}

const params = new URLSearchParams(location.search)
const raw = params.get('v')
const only = raw && raw !== 'bar' ? raw : null
const bar = document.getElementById('bar')
const desc = document.getElementById('desc')
const stage = document.getElementById('stage')

function show(k) {
  desc.innerHTML = VARIANTS[k].desc
  stage.innerHTML = VARIANTS[k].html
  for (const b of bar.querySelectorAll('.tabbtn')) b.classList.toggle('is-on', b.dataset.k === k)
}

if (only) {
  bar.remove(); desc.remove()
  stage.style.padding = '0'
  document.body.style.padding = '0'
  stage.innerHTML = VARIANTS[only].html
} else {
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('.tabbtn')
    if (b) show(b.dataset.k)
  })
  show('a')
}
