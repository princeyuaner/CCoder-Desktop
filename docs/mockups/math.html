<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>数学公式渲染 · 方案审批</title>
<link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css" />
<script src="../../node_modules/katex/dist/katex.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0d0d0f; }
body {
  color: #e8e8ee;
  font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 60px;
}
code, pre { font-family: 'Cascadia Mono', Consolas, monospace; }

#bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 24px;
  background: rgba(13,13,15,.92); backdrop-filter: blur(14px);
  border-bottom: 1px solid #1e1e24;
}
#bar h1 { font-size: 14px; font-weight: 600; margin-right: 10px; color: #cfcfd8; }
.tabbtn {
  padding: 6px 14px; font-size: 13px; border-radius: 8px;
  color: #9a9aa8; border: 1px solid #26262e; background: #16161a;
  cursor: default;
}
.tabbtn.is-on { color: #0d0d0f; background: #e8e8ee; border-color: #e8e8ee; font-weight: 600; }
#desc { padding: 12px 24px 0; font-size: 12.5px; color: #7c7c8c; max-width: 980px; line-height: 1.75; }
#desc b { color: #b9b9c8; font-weight: 500; }
#desc code { font-size: 11.5px; padding: 1px 5px; border-radius: 4px; background: #1c1c22; color: #c3c3d4; }
#stage { padding: 18px 24px 0; }

/* ── 还原真实界面 ─────────────────────────────────────── */
.pane {
  width: 1080px;
  background: #191919;
  border: 1px solid #26262e; border-radius: 12px;
  padding: 24px 44px 28px;
  margin-bottom: 20px;
}
.inner { max-width: 820px; margin: 0 auto; }
.tl { position: relative; }
.tl::before {
  content: ''; position: absolute; left: 4px; top: 10px; bottom: 14px;
  width: 1px; background: #2c2c2c;
}
.row { position: relative; padding-left: 26px; margin-bottom: 14px; }
.dot {
  position: absolute; left: 0; top: 5px; width: 9px; height: 9px;
  border-radius: 50%; background: #3a3a46; box-shadow: 0 0 0 3px #191919;
}
.dot.me { background: #22d3ee; box-shadow: 0 0 0 3px #191919, 0 0 10px rgba(34,211,238,.55); }
.me {
  display: inline-block; padding: 7px 12px;
  font-size: 14px; line-height: 1.65; color: #d8f8ff;
  background: rgba(34,211,238,.09); border: 1px solid rgba(34,211,238,.22);
  border-radius: 8px;
}
.row--me { display: flex; justify-content: flex-end; }

/* ── .md 排版：直接抄 chat.css 的「明度分层」 ──────────── */
.md { font-size: 14px; line-height: 1.8; color: #dcdce6; }
.md > * + * { margin-top: 14px; }
.md .md-h { margin: 0; font-weight: 600; color: #f0f0f6; }
.md > h2.md-h, .md > h3.md-h { margin-top: 20px; }
.md > h2.md-h:first-child, .md > h3.md-h:first-child { margin-top: 0; }
.md h2.md-h { font-size: 16px; }
.md h3.md-h { font-size: 15px; }
.md .md-p { margin: 0; white-space: pre-wrap; }
.md .md-list { margin: 0; padding-left: 20px; }
.md .md-list li { margin-bottom: 5px; }
.md .md-list li::marker { color: #6a6a7c; }
.md .ic {
  padding: 2px 6px; font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: .86em; color: #ddd6fe; background: #26262f; border-radius: 5px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.md strong { color: #fff; font-weight: 600; }
.md em { font-style: italic; opacity: .92; }
.md .codebox {
  position: relative; padding: 12px 14px;
  background: rgba(255,255,255,.045); border-radius: 10px;
}
.md .codebox__lang {
  display: block; margin-bottom: 6px;
  font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: 10.5px; letter-spacing: .5px; color: #565664;
}
.md .codebox__cp { position: absolute; top: 10px; right: 13px; font-size: 11px; color: #5c5c6a; }
.md .code {
  margin: 0; overflow-x: auto;
  font-size: 12.5px; line-height: 1.65; color: #c8c8d4; white-space: pre;
}
.md .tblwrap {
  padding: 10px 14px; background: rgba(255,255,255,.022);
  border-radius: 10px; max-width: 100%; overflow-x: auto;
}
.md table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.md th {
  text-align: left; padding: 6px 10px; font-weight: 500;
  color: #8a8a9c; border-bottom: 1px solid rgba(255,255,255,.07);
}
.md td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.04); }
.md tr:last-child td { border-bottom: none; }
.tok-k { color: #c792ea; } .tok-s { color: #c3e88d; }
.tok-n { color: #ffcb6b; } .tok-c { color: #5a5a68; font-style: italic; }

/* ══ 方案差异 ══════════════════════════════════════════ */

/* A · 现状：$$ 原样输出 —— 什么都不用加，本来就是 <p> 里的文本 */
[data-v="a"] .raw-math { white-space: pre-wrap; }

/* B / C · 块级公式 */
.math-block {
  display: flex; justify-content: center;
  padding: 14px 16px;
  background: rgba(255,255,255,.022);
  border-radius: 10px;
  overflow-x: auto;
  overflow-y: hidden;
}
.math-block .katex { font-size: 1.08em; }
/* KaTeX 默认色是纯黑，深色主题必须改 */
.math-block .katex,
.md .math-inline .katex { color: #e4e4f0; }

/* C · 行内公式 */
.math-inline {
  padding: 0 1px;
  color: #e4e4f0;
}
.math-inline .katex { font-size: 1.02em; }

/* 公式标注：给审批看的分区标题 */
.sect {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 12px;
  font-size: 11px; letter-spacing: .6px; color: #5c5c6a;
  text-transform: uppercase;
}
.sect::after { content: ''; flex: 1; height: 1px; background: #242430; }
.pane__tag {
  display: inline-block; margin-bottom: 14px;
  padding: 2px 8px; border-radius: 5px;
  font-size: 10.5px; letter-spacing: .5px;
  color: #7c7c8c; background: #202028;
}
</style>
</head>
<body>

<div id="bar">
  <h1>数学公式渲染 · 方案审批</h1>
  <button class="tabbtn" data-k="a">A 现状</button>
  <button class="tabbtn" data-k="b">B 只加块级</button>
  <button class="tabbtn" data-k="c">C 块级 + 行内</button>
</div>
<div id="desc"></div>
<div id="stage"></div>

<script>
/* ── 内容：一段真实的模型回答 ─────────────────────────── */

const SAY = '帮我推导一下高斯积分，顺便说说欧拉恒等式'

/* A：现状 —— $$ 当普通文本，原样吐出来 */
const A_BODY = `
  <h2 class="md-h">欧拉恒等式</h2>
  <p class="md-p raw-math">$$e^{i\\pi} + 1 = 0$$</p>
  <p class="md-p">这是欧拉公式 $e^{i\\theta} = \\cos\\theta + i\\sin\\theta$ 在 $\\theta = \\pi$ 时的特例。</p>
  <h2 class="md-h">高斯积分</h2>
  <p class="md-p raw-math">$$\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}$$</p>
  <p class="md-p">标准做法是平方后转成极坐标。设 $I$ 为待求积分，则 $I^2$ 可以写成二重积分。</p>
  <ul class="md-list">
    <li>先取平方 <span class="ic">I² = ∫∫ e^(−x²−y²) dx dy</span></li>
    <li>换成极坐标：<span class="ic">x² + y² = r²</span>，面积元变成 <span class="ic">r dr dθ</span></li>
    <li>径向积分得到 <span class="ic">π</span>，开方即得结果</li>
  </ul>
  <p class="md-p"><strong>注意：</strong>这里用的是反常积分，收敛性需要单独说明。</p>
`

/* B：块级公式渲染，行内仍然原样 */
const B_BODY = `
  <h2 class="md-h">欧拉恒等式</h2>
  <div class="math-block"><span class="MATH1"></span></div>
  <p class="md-p">这是欧拉公式 $e^{i\\theta} = \\cos\\theta + i\\sin\\theta$ 在 $\\theta = \\pi$ 时的特例。</p>
  <h2 class="md-h">高斯积分</h2>
  <div class="math-block"><span class="MATH2"></span></div>
  <p class="md-p">标准做法是平方后转成极坐标。设 $I$ 为待求积分，则 $I^2$ 可以写成二重积分。</p>
  <ul class="md-list">
    <li>先取平方 <span class="ic">I² = ∫∫ e^(−x²−y²) dx dy</span></li>
    <li>换成极坐标：<span class="ic">x² + y² = r²</span>，面积元变成 <span class="ic">r dr dθ</span></li>
    <li>径向积分得到 <span class="ic">π</span>，开方即得结果</li>
  </ul>
  <p class="md-p"><strong>注意：</strong>这里用的是反常积分，收敛性需要单独说明。</p>
`

/* C：块级 + 行内 */
const C_BODY = `
  <h2 class="md-h">欧拉恒等式</h2>
  <div class="math-block"><span class="MATHR1"></span></div>
  <p class="md-p">这是欧拉公式 <span class="math-inline"><span class="MATHR2"></span></span> 在 <span class="math-inline"><span class="MATHR3"></span></span> 时的特例。</p>
  <h2 class="md-h">高斯积分</h2>
  <div class="math-block"><span class="MATHR4"></span></div>
  <p class="md-p">标准做法是平方后转成极坐标。设 <span class="math-inline"><span class="MATHR5"></span></span> 为待求积分，则 <span class="math-inline"><span class="MATHR6"></span></span> 可以写成二重积分：</p>
  <div class="math-block"><span class="MATHR7"></span></div>
  <p class="md-p">换成极坐标后，面积元变成 <span class="math-inline"><span class="MATHR8"></span></span>，径向积分得到 <span class="math-inline"><span class="MATHR9"></span></span>，开方即得结果。</p>
  <p class="md-p"><strong>注意：</strong>这里用的是反常积分，收敛性需要单独说明。</p>
`

const E = {
  MATH1: 'e^{i\\pi} + 1 = 0',
  MATH2: '\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}',
  MATHR1: 'e^{i\\pi} + 1 = 0',
  MATHR2: 'e^{i\\theta} = \\cos\\theta + i\\sin\\theta',
  MATHR3: '\\theta = \\pi',
  MATHR4: '\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}',
  MATHR5: 'I',
  MATHR6: 'I^2',
  MATHR7: 'I^2 = \\iint_{\\mathbb{R}^2} e^{-(x^2+y^2)}\\,dx\\,dy = \\int_0^{2\\pi}\\!\\!\\int_0^{\\infty} e^{-r^2} r\\,dr\\,d\\theta',
  MATHR8: 'r\\,dr\\,d\\theta',
  MATHR9: '\\pi'
}

const VARIANTS = {
  a: {
    body: A_BODY,
    desc: '<b>A · 现状</b> —— 手写解析器不认 <code>$$</code>，公式连同定界符原样当普通段落输出。行内 <code>$...$</code> 也一样。这就是你现在看到的效果。'
  },
  b: {
    body: B_BODY,
    desc: '<b>B · 只加块级</b> —— 独立成段的 <code>$$...$$</code> 走 KaTeX，居中、后面垫一层和表格同级的浅底。行内 <code>$...$</code> 保持原样。误伤率为零：块级定界符不会在正常文本里出现。'
  },
  c: {
    body: C_BODY,
    desc: '<b>C · 块级 + 行内</b> —— 在 B 的基础上，行内 <code>$...$</code> 也渲染。需要保守判断：<code>$</code> 两侧不能是空格、不能紧跟数字，否则「价格 $5 到 $10」会被吃掉。右侧单独标了误判用例。'
  }
}

const CTX = (html) => `
  <div class="pane">
    <div class="inner"><div class="tl">
      <div class="row row--me">
        <span class="dot me"></span>
        <span class="me">${SAY}</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <div class="md">${html}</div>
      </div>
    </div></div>
  </div>`

/* 行内定界符的误判对照 —— 只有 C 需要看 */
const FALSE_POSITIVE = `
  <div class="pane">
    <span class="pane__tag">行内 $ 的误判对照（仅 C 需要关心）</span>
    <div class="inner"><div class="md">
      <div class="sect">应渲染</div>
      <p class="md-p">设 <span class="math-inline"><span class="MR1"></span></span>，则面积为 <span class="math-inline"><span class="MR2"></span></span>。</p>
      <p class="md-p">变量写作 <span class="math-inline"><span class="MR3"></span></span> 和 <span class="math-inline"><span class="MR4"></span></span>。</p>
      <div class="sect">不应渲染（保留原文本）</div>
      <p class="md-p">这个方案预算是 $5 到 $10，超出部分按 $2 每小时计费。</p>
      <p class="md-p">环境变量 $HOME 和 $PATH 也要一并设置。</p>
      <p class="md-p">在 shell 里执行 $((1 + 2)) 得到 3。</p>
      <div class="sect">这条挡不住（可接受）</div>
      <p class="md-p">从 $x 到 y$ 的范围，两端都要包含。</p>
      <p class="md-p">代价：一对 $ 之间恰好是像公式的短文本时会被渲染。概率低，改错也能一眼看出来。</p>
      <div class="sect">判定规则</div>
      <ul class="md-list">
        <li>开 <code>$</code> 后面不能是空格或数字，闭 <code>$</code> 前面不能是空格</li>
        <li>闭 <code>$</code> 后面不能紧跟数字（挡掉 <code>$5 ... $10</code> 这种价格区间）</li>
        <li>内容里不能有换行；同一行内至少要有一对</li>
        <li>块级 <code>$$...$$</code> 优先匹配，不会被行内规则拆开</li>
        <li>已知残留：<code>$HOME</code>、<code>$((...))</code> 这类 shell 语法挡得住，但纯字母变量对挡不住</li>
      </ul>
    </div></div>
  </div>`

const FALSE_E = {
  MR1: 'x^2 + y^2 = r^2',
  MR2: 'S = \\pi r^2',
  MR3: 'a',
  MR4: 'b'
}

/* ── 渲染 ──────────────────────────────────────────────── */

const DISPLAY = new Set(['MATH1', 'MATH2', 'MATHR1', 'MATHR4', 'MATHR7'])

function renderMath() {
  for (const [k, tex] of Object.entries(E)) {
    const el = document.querySelector('.' + k)
    if (!el) continue
    try {
      katex.render(tex, el, { throwOnError: false, displayMode: DISPLAY.has(k) })
    } catch (e) {
      el.textContent = tex
    }
  }
  for (const [k, tex] of Object.entries(FALSE_E)) {
    const el = document.querySelector('.' + k)
    if (!el) continue
    try { katex.render(tex, el, { throwOnError: false, displayMode: false }) } catch { el.textContent = tex }
  }
}

const params = new URLSearchParams(location.search)
const raw = params.get('v')
const only = raw && raw !== 'bar' ? raw : null
const bar = document.getElementById('bar')
const desc = document.getElementById('desc')
const stage = document.getElementById('stage')

function show(k) {
  desc.innerHTML = VARIANTS[k].desc
  stage.innerHTML =
    CTX(VARIANTS[k].body) + (k === 'c' ? FALSE_POSITIVE : '')
  renderMath()
  for (const b of bar.querySelectorAll('.tabbtn')) b.classList.toggle('is-on', b.dataset.k === k)
}

if (only) {
  bar.remove(); desc.remove()
  stage.style.padding = '0'
  stage.innerHTML = CTX(VARIANTS[only].body) + (only === 'c' ? FALSE_POSITIVE : '')
  renderMath()
} else {
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('.tabbtn')
    if (b) show(b.dataset.k)
  })
  show('a')
}
</script>
</body>
</html>
