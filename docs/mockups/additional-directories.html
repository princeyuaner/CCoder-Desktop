<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>附加目录（会话级） · 效果图</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root, :root[data-theme='dark'] {
  color-scheme: dark;
  --bg-app: #191919;
  --bg-sidebar: #141414;
  --bg-raised: #232323;
  --bg-hover: #1f1f1f;
  --bg-active: #2a2a2a;
  --border: #2c2c2c;
  --border-soft: #242424;
  --text: #e8e8e8;
  --text-dim: #a8a8a8;
  --text-muted: #8a8a8a;
  --text-faint: #6b6b6b;
  --accent: #e8e8e8;
  --accent-fg: #191919;
  --ok: #4b9e5f;
  --warn: #c9a227;
  --danger: #e5534b;
  --brand: #d97757;
  --brand-soft: rgba(217, 119, 87, .12);
  --brand-border: rgba(217, 119, 87, .34);
  --focus: #7aa2c8;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg-app: #f6f6f7;
  --bg-sidebar: #efeff1;
  --bg-raised: #ffffff;
  --bg-hover: #e9e9ec;
  --bg-active: #e2e2e6;
  --border: #d7d7dc;
  --border-soft: #e5e5e8;
  --text: #1d1d1f;
  --text-dim: #4c4c53;
  --text-muted: #6c6c75;
  --text-faint: #95959e;
  --accent: #1d1d1f;
  --accent-fg: #ffffff;
  --ok: #2f8a45;
  --warn: #a97b0b;
  --danger: #c83b32;
  --brand: #b04a28;
  --brand-soft: rgba(176, 74, 40, .09);
  --brand-border: rgba(176, 74, 40, .3);
  --focus: #3f6f9d;
}
html, body { background: #0d0d0f; }
:root[data-theme='light'] body { background: #e8e8ec; }
body {
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 60px;
}
code, .mono { font-family: 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: none; cursor: default; }
b { font-weight: 600; }
svg.ic { width: 14px; height: 14px; flex: none; display: block; }

/* ── 顶栏 ───────────────────────────────────────────────── */
#bar {
  position: sticky; top: 0; z-index: 90;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 24px;
  background: color-mix(in srgb, var(--bg-app) 92%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
}
#bar h1 { font-size: 14px; font-weight: 600; margin-right: 10px; color: var(--text); }
.tabbtn {
  padding: 6px 14px; font-size: 13px; border-radius: 8px;
  color: var(--text-dim); border: 1px solid var(--border); background: var(--bg-raised);
}
.tabbtn:hover { color: var(--text); border-color: var(--text-faint); }
.tabbtn.is-on { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
.themebtn {
  margin-left: auto; padding: 6px 12px; font-size: 12.5px;
  color: var(--text-dim); border: 1px solid var(--border); background: var(--bg-raised); border-radius: 8px;
}
.themebtn:hover { color: var(--text); }
#desc { padding: 12px 24px 0; font-size: 12.5px; color: var(--text-muted); max-width: 1080px; line-height: 1.8; }
#desc b { color: var(--text-dim); font-weight: 500; }
#desc code { color: var(--brand); }
#desc .fact {
  display: block; margin-top: 10px; padding: 10px 13px;
  background: var(--bg-raised); border-left: 2px solid var(--border);
  border-radius: 0 7px 7px 0; color: var(--text-muted);
}
#desc .fact b { color: var(--text); }
#desc .rec {
  display: inline-block; margin-left: 8px; padding: 1px 7px; vertical-align: 1px;
  font-size: 10.5px; color: var(--brand); background: var(--brand-soft);
  border: 1px solid var(--brand-border); border-radius: 999px;
}
#stage { padding: 18px 24px 0; }

/* ── 应用外壳 ───────────────────────────────────────────── */
.app {
  display: flex; flex-direction: column;
  width: 1180px; height: 760px;
  background: var(--bg-app); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.titlebar {
  flex: none; display: flex; align-items: center; gap: 9px;
  height: 36px; padding: 0 12px;
  background: var(--bg-sidebar); border-bottom: 1px solid var(--border-soft);
}
.brand { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.brand svg { width: 15px; height: 15px; color: var(--text-dim); }
.titlebar .sp { flex: 1; }
.winbtn { display: grid; place-items: center; width: 34px; height: 26px; font-size: 13px; color: var(--text-muted); border-radius: 5px; }
.winbtn:hover { background: var(--bg-hover); color: var(--text); }
.winbtn.x:hover { background: rgba(229, 83, 75, .16); color: #ff9a93; }
.shell { display: flex; flex: 1; min-height: 0; }

/* ── 侧栏 ───────────────────────────────────────────────── */
.side {
  flex: none; width: 264px; padding: 12px 10px 10px;
  background: var(--bg-sidebar); border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column;
}
.side__nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.side__navitem { display: flex; align-items: center; gap: 9px; padding: 6px 9px; font-size: 12.5px; color: var(--text-muted); border-radius: 6px; }
.side__navitem:hover { background: var(--bg-hover); color: var(--text-dim); }
.side__head { display: flex; align-items: center; gap: 6px; padding: 7px 9px 6px; }
.side__head-t { flex: 1; font-size: 10.5px; letter-spacing: .4px; color: var(--text-faint); }
.side__tool { display: grid; place-items: center; width: 22px; height: 22px; font-size: 12px; color: var(--text-faint); border-radius: 5px; }
.side__tool:hover { background: var(--bg-hover); color: var(--text-dim); }
.wsrow-side { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 6px; color: var(--text); font-size: 12.5px; }
.wsrow-side:hover { background: var(--bg-hover); }
.wsrow-side .n { font-size: 11px; color: var(--text-faint); }
.wsrow-side .acts { display: flex; gap: 1px; margin-left: auto; }
.wsrow-side .act { display: grid; place-items: center; width: 20px; height: 20px; font-size: 12px; color: var(--text-faint); border-radius: 4px; }
.wsrow-side .act:hover { background: var(--bg-active); color: var(--text); }
.sess { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px 7px 27px; border-radius: 6px; text-align: left; }
.sess:hover { background: var(--bg-hover); }
.sess.is-on { background: var(--bg-active); }
.sess__t { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess.is-on .sess__t { color: var(--text); }
.sess__tm { flex: none; font-size: 11px; color: var(--text-faint); }
.side__foot { margin-top: auto; border-top: 1px solid var(--border-soft); padding-top: 8px; }
.side__foot .side__navitem.is-on { background: var(--bg-active); color: var(--text); }

/* ── 设置页 ─────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; flex: 1; min-width: 0; background: var(--bg-app); }
.settings-head {
  flex: none; display: flex; align-items: center; gap: 12px;
  padding: 14px 40px 12px; border-bottom: 1px solid var(--border-soft);
}
.backbtn { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 11px; font-size: 12.5px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 7px; }
.backbtn:hover { background: var(--bg-raised); color: var(--text); }
.settings-title { font-size: 15px; font-weight: 600; }
.savehint { margin-left: auto; font-size: 12.5px; color: var(--text-faint); }
.settings-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 168px 1fr; }
.settings-nav { display: flex; flex-direction: column; gap: 2px; padding: 14px 12px; border-right: 1px solid var(--border-soft); }
.navgroup { padding: 12px 12px 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .5px; color: var(--text-faint); }
.navgroup:first-child { padding-top: 2px; }
.navitem { padding: 7px 10px; font-size: 13.5px; color: var(--text-dim); border-radius: 6px; text-align: left; }
.navitem:hover { background: var(--bg-hover); color: var(--text); }
.navitem.is-on { background: var(--bg-active); color: var(--text); }
.settings-content { min-height: 0; overflow-y: auto; padding: 20px 40px 32px; }
.settings-content::-webkit-scrollbar { width: 10px; }
.settings-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
.chform { max-width: 640px; }
.chform-title { margin: 0; font-size: 14px; font-weight: 600; }
.chform--sep { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-soft); }
.field { display: grid; grid-template-columns: 132px 1fr; gap: 12px; margin-top: 16px; }
.field-label { padding-top: 7px; font-size: 13px; color: var(--text-dim); }
.field-body { min-width: 0; }
.field-hint { margin: 6px 0 0; font-size: 12px; color: var(--text-faint); }
.selectbox {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; font-size: 13px; color: var(--text);
  background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px;
}
.selectbox:hover { border-color: var(--text-faint); }
.select-sub { font-size: 12px; color: var(--text-faint); }
.select-chev { margin-left: auto; color: var(--text-muted); font-size: 11px; }

.sect-head { display: flex; align-items: center; gap: 8px; }
.newbadge { padding: 1px 7px; font-size: 10.5px; font-weight: 600; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-border); border-radius: 999px; }
.count { margin-left: auto; font-size: 12px; color: var(--text-faint); }
.lead { margin: 8px 0 16px; font-size: 12.5px; line-height: 1.7; color: var(--text-muted); }
.lead code, .foot code { font-size: 11.5px; color: var(--text-dim); background: var(--bg-raised); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-soft); }
.wsrow { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.wsrow-label { font-size: 12.5px; color: var(--text-dim); }
.ws-select { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; font-size: 12.5px; color: var(--text); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 7px; }
.ws-select:hover { border-color: var(--text-faint); }
.ws-select .chev { color: var(--text-muted); font-size: 10px; }
.ws-path { min-width: 0; font-size: 11.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scope { margin-bottom: 14px; padding: 10px 12px; background: var(--bg-raised); border: 1px solid var(--border-soft); border-radius: 9px; }
.scope-label { display: block; margin-bottom: 8px; font-size: 11px; letter-spacing: .4px; color: var(--text-faint); }
.scope-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.scope-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 11.5px; color: var(--text-dim); background: var(--bg-app); border: 1px solid var(--border); border-radius: 6px; }
.scope-chip--ws { color: var(--text); border-color: var(--text-faint); }
.scope-chip .muted { color: var(--text-faint); }
.scope-plus { font-size: 12px; color: var(--text-faint); }
.scope-add { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; font-size: 11.5px; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 6px; }
.scope-add:hover { color: var(--text); border-color: var(--text-faint); }

.dirlist { display: flex; flex-direction: column; gap: 8px; }
.dirrow {
  display: grid; grid-template-columns: 26px 1fr auto auto; gap: 10px; align-items: center;
  padding: 10px 12px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 9px;
}
.dirrow:hover { border-color: var(--text-faint); }
.dirico { display: grid; place-items: center; width: 26px; height: 26px; color: var(--text-muted); background: var(--bg-app); border-radius: 6px; }
.dirmain { min-width: 0; }
.dirpath { display: block; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dirpath .dim { color: var(--text-faint); }
.dirmeta { display: block; margin-top: 3px; font-size: 11px; color: var(--text-faint); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; white-space: nowrap; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.status.danger { color: var(--danger); }
.rowacts { display: flex; align-items: center; gap: 2px; }
.iconbtn { display: grid; place-items: center; width: 26px; height: 26px; color: var(--text-faint); border-radius: 5px; }
.iconbtn:hover { background: var(--bg-active); color: var(--text); }
.iconbtn.danger:hover { background: rgba(229, 83, 75, .13); color: var(--danger); }
.addrow {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  margin-top: 8px; padding: 9px; font-size: 12.5px; color: var(--text-muted);
  border: 1px dashed var(--border); border-radius: 9px;
}
.addrow:hover { color: var(--text); border-color: var(--text-faint); background: var(--bg-raised); }
.foot { margin: 10px 0 0; font-size: 11.5px; line-height: 1.7; color: var(--text-faint); }
.safety { display: flex; gap: 8px; margin-top: 10px; padding: 9px 11px; font-size: 11.5px; line-height: 1.6; color: var(--text-muted); background: var(--bg-raised); border-radius: 7px; }
.safety svg { margin-top: 1px; color: var(--warn); }

/* ── 聊天区（B/C） ───────────────────────────────────────── */
.chat-head { flex: none; display: flex; align-items: center; gap: 9px; padding: 13px 26px 11px; border-bottom: 1px solid var(--border-soft); }
.chat-title { min-width: 0; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { flex: none; padding: 2px 9px; font-size: 11.5px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 999px; }
.chat-body { flex: 1; min-height: 0; overflow: hidden; padding: 16px 26px 0; }
.chat-in { max-width: 700px; margin: 0 auto; }
.msg { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.bubble { max-width: 78%; padding: 8px 12px; font-size: 13px; line-height: 1.65; color: var(--text); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 9px; }
.say { margin-bottom: 12px; font-size: 13px; line-height: 1.7; color: var(--text-dim); }
.say code { padding: 1px 5px; font-size: .9em; color: var(--text); background: var(--bg-raised); border-radius: 4px; border: 1px solid var(--border-soft); }
.toolcard { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px; }
.toolcard .grow { flex: 1; }
.toolcard code { font-size: 11px; color: var(--text-dim); }
.composer-wrap { position: relative; flex: none; padding: 0 26px 14px; }
.cwdrow { display: flex; align-items: center; gap: 7px; max-width: 700px; margin: 0 auto 6px; padding: 0 3px; }
.cwdchip { display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 10px; font-size: 12px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 999px; }
.cwdchip .name { font-weight: 500; color: var(--text); }
.cwdchip.adddirs { color: var(--text-dim); }
.cwdchip.adddirs.is-on { color: var(--brand); border-color: var(--brand-border); background: var(--brand-soft); }
.cwdchip .n { padding: 0 5px; font-size: 10.5px; color: var(--text-faint); background: var(--bg-app); border-radius: 999px; }
.cwdchip.adddirs.is-on .n { color: var(--brand); background: transparent; }
.cfchip { display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 10px; font-size: 11.5px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 999px; }
.cbox { max-width: 700px; margin: 0 auto; padding: 11px 11px 9px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px; }
.cin { padding: 2px 4px 10px; font-size: 13px; color: var(--text-faint); }
.cbar { display: flex; align-items: center; gap: 7px; }
.sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 10px; font-size: 12px; color: var(--text-dim); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 999px; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.send { display: grid; place-items: center; width: 30px; height: 30px; color: var(--accent-fg); background: var(--accent); border-radius: 50%; }

/* ── 可访问目录弹层 ─────────────────────────────────────── */
.popover {
  position: absolute; left: 26px; bottom: 150px; z-index: 20;
  width: 404px; padding: 0; overflow: hidden;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
}
.pop-head { display: flex; align-items: center; gap: 8px; padding: 12px 13px 10px; border-bottom: 1px solid var(--border-soft); }
.pop-title { font-size: 13px; font-weight: 600; }
.pop-sub { margin-left: auto; font-size: 11px; color: var(--text-faint); }
.pop-close { display: grid; place-items: center; width: 22px; height: 22px; color: var(--text-faint); border-radius: 5px; }
.pop-close:hover { background: var(--bg-active); color: var(--text); }
.pop-body { padding: 11px 13px 12px; }
.pop-group { margin-bottom: 9px; }
.pop-label { display: block; margin-bottom: 5px; font-size: 10.5px; letter-spacing: .4px; color: var(--text-faint); }
.pop-row { display: flex; align-items: center; gap: 8px; padding: 6px 7px; border-radius: 6px; }
.pop-row:hover { background: var(--bg-hover); }
.pop-row .p { flex: 1; min-width: 0; font-size: 11.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-row .p b { color: var(--text); font-weight: 500; }
.pop-row .tag { flex: none; padding: 1px 6px; font-size: 10px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 999px; }
.pop-row .x { flex: none; display: grid; place-items: center; width: 20px; height: 20px; color: var(--text-faint); border-radius: 4px; }
.pop-row .x:hover { background: rgba(229, 83, 75, .13); color: var(--danger); }
.pop-add { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; padding: 7px; font-size: 12px; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 7px; }
.pop-add:hover { color: var(--text); border-color: var(--text-faint); }
.pop-check { display: flex; align-items: center; gap: 8px; padding: 9px 2px 2px; font-size: 12px; color: var(--text-dim); }
.check { display: grid; place-items: center; width: 15px; height: 15px; color: var(--accent-fg); background: var(--accent); border-radius: 4px; }
.pop-restart { display: flex; gap: 7px; margin: 8px 0 0; padding: 8px 10px; font-size: 11.5px; line-height: 1.55; color: var(--text-muted); background: var(--bg-app); border-radius: 7px; }
.pop-restart svg { margin-top: 1px; color: var(--warn); }
.pop-foot { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-top: 1px solid var(--border-soft); }
.pop-foot .hint { flex: 1; font-size: 11px; color: var(--text-faint); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12.5px; border-radius: 7px; border: 1px solid transparent; }
.btn--ghost { color: var(--text-dim); border-color: var(--border); }
.btn--ghost:hover { background: var(--bg-active); color: var(--text); }
.btn--primary { color: var(--accent-fg); background: var(--accent); font-weight: 500; }
.btn--danger { color: var(--danger); border-color: rgba(229, 83, 75, .4); }

/* ── 工作区菜单 + 弹窗（C） ─────────────────────────────── */
.menu {
  position: absolute; z-index: 30; width: 200px; padding: 5px;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 9px; box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
}
.menu__it { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px; font-size: 12.5px; color: var(--text-dim); border-radius: 6px; text-align: left; }
.menu__it:hover { background: var(--bg-active); color: var(--text); }
.menu__it.is-on { background: var(--brand-soft); color: var(--brand); }
.menu__it .k { margin-left: auto; font-size: 10.5px; color: var(--text-faint); }
.menu__sep { height: 1px; margin: 4px 6px; background: var(--border); }
.side { position: relative; }

.scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, .48); }
.modal {
  position: absolute; left: 50%; top: 50%; z-index: 41; transform: translate(-50%, -50%);
  width: 540px; overflow: hidden;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 13px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
}

const desc = document.getElementById('desc')
const stage = document.getElementById('stage')
const themeBtn = document.getElementById('theme')

function syncThemeLabel() {
  const light = document.documentElement.dataset.theme === 'light'
  themeBtn.textContent = light ? '切换深色' : '切换浅色'
}
themeBtn.addEventListener('click', () => {
  const el = document.documentElement
  el.dataset.theme = el.dataset.theme === 'light' ? 'dark' : 'light'
  syncThemeLabel()
})

function show(k) {
  const v = VARIANTS[k]
  if (!v) return
  desc.innerHTML = v.desc
  stage.innerHTML = v.html
  for (const b of bar.querySelectorAll('.tabbtn')) b.classList.toggle('is-on', b.dataset.k === k)
}

if (only && VARIANTS[only]) {
  bar.remove()
  desc.remove()
  stage.style.padding = '0'
  stage.innerHTML = VARIANTS[only].html
} else {
  syncThemeLabel()
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('.tabbtn')
    if (b) show(b.dataset.k)
  })
  show('a')
}
</script>
</body>
</html>
