appId: com.ccoder.desktop
productName: CCoder
copyright: Copyright © 2026 CCoder

directories:
  output: release
  buildResources: build

# 主进程 / preload / renderer 都已经 bundle，运行时不需要 node_modules ——
# 只带 out/ 和 package.json。
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  # 不排掉 node_modules 的话，electron-builder 会把 Monaco 源码整包塞进 app.asar。
  - "!node_modules/**/*"

asar: true
npmRebuild: false

# ripgrep 由 tools/stage-rg.cjs 从 @vscode/ripgrep 的平台包复制到 build/rg；
# 放在 asar 外，运行时从 process.resourcesPath/bin 启动。
extraResources:
  - from: build/rg
    to: bin

# Windows 用 node_modules 里已装好的 Electron（win32-x64），避免每次打包都
# 去 GitHub 拉 100+MB 的 zip。这个路径由 package:win 通过 --config.electronDist
# 传入，不写死在这里 —— 否则 Linux / macOS 目标会拿到 Windows 的 Electron。
# 自动更新源：GitHub Releases。
# 构建时 electron-builder 会把 provider / owner / repo 写进
# resources/app-update.yml，客户端据此找 latest.yml 和安装包 ——
# 这里的 owner/repo 必须和真正存放 Release 的仓库一致。
publish:
  provider: github
  owner: princeyuaner
  repo: CCoder-Desktop
  # 默认会建草稿 Release；固定成正式 Release，客户端才看得到
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CCoder
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  executableName: ccoder
  # deb 包必须带维护者邮箱；沿用 package.json 里的作者身份
  maintainer: 'CCoder <594954848@qq.com>'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
    # zip 是 macOS 自动更新的载体；签名配置好后 electron-updater 才能用
    - target: zip

