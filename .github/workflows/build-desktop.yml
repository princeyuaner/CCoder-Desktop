name: Build desktop packages

# 推 v* 标签：三端构建，然后汇总上传到同名 GitHub Release。
# 手动触发：只出 Actions artifact，不建 Release。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 打包前先挡一道：类型错误不必等到三端各跑完 10 分钟才发现。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron / electron-builder 的下载缓存：不缓存的话三端每次都要
      # 重新拉 100MB+ 的 Electron，构建时间会多出好几分钟。
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: ccoder-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: ccoder-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-14
    env:
      # 配了 MAC_CSC_LINK 就启用签名；没配则关掉钥匙串自动发现，照常出未签名包。
      #
      # 不要把 CSC_LINK / CSC_KEY_PASSWORD 直接写进 job env：secret 不存在时
      # GitHub 会把它们设成**空字符串**，而 electron-builder 只判空值不判空串，
      # 空串会被 path.resolve 成仓库根目录，报 "<repo> not a file" 并让 macOS
      # 构建失败。用 MAC_* 中转，下面确认非空后再写进 GITHUB_ENV。
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      # 公证暂未开启（electron-builder.yml 里没有 mac.notarize）；
      # 凭证先留着，接入时直接可用。
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # macos-14 runner 内存比 Windows/Linux 少，electron-vite 打 11MB 的
      # renderer bundle 时会撞到默认 ~4GB 堆上限（exit 134）。抬到 5GB。
      NODE_OPTIONS: '--max-old-space-size=5120'
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS signing
        if: env.MAC_CSC_LINK != ''
        shell: bash
        run: |
          printf 'CSC_LINK=%s\n' "$MAC_CSC_LINK" >> "$GITHUB_ENV"
          printf 'CSC_KEY_PASSWORD=%s\n' "$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ccoder-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  # 三端都构建成功后，汇总产物，创建一个正式 Release 并上传。
  # 用独立的 release job 而不是让每个平台各自 --publish：避免三个 job
  # 同时创建同一个 Release 时互相撞车。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CCoder ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
