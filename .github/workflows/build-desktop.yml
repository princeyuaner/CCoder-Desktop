name: Build desktop packages

# 推 v* 标签：三端构建，然后汇总上传到同名 GitHub Release。
# 手动触发：只出 Actions artifact，不建 Release。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: ccoder-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: ccoder-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  macos:
    runs-on: macos-14
    env:
      # 没有签名证书时别让 electron-builder 去找钥匙串；出的是未签名 dmg，
      # 需要签名 / 公证时再在仓库 Secrets 里配 CSC_LINK、APPLE_ID 等。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # macos-14 runner 内存比 Windows/Linux 少，electron-vite 打 11MB 的
      # renderer bundle 时会撞到默认 ~4GB 堆上限（exit 134）。抬到 5GB。
      NODE_OPTIONS: '--max-old-space-size=5120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ccoder-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  # 三端都构建成功后，汇总产物，创建一个正式 Release 并上传。
  # 用独立的 release job 而不是让每个平台各自 --publish：避免三个 job
  # 同时创建同一个 Release 时互相撞车。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CCoder ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
